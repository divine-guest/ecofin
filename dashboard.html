/* ============ Календарь «Копилка» (стиль Google Calendar) ============ */
const CAL = (() => {
  const HABITS_LIST = [
    { id: "money", icon: "💰", label: "Отложил деньги", active: true },
    { id: "expenses", icon: "📊", label: "Внести траты", active: false, href: "expenses.html" },
    { id: "learn", icon: "📚", label: "Почитать статью", active: false, href: "knowledge.html" },
  ];
  let view = null; // просматриваемый месяц {y, m}

  function key() { const x = PF.user(); return "pf_habits_" + (x ? x.email : "guest"); }
  function daysArr() { return JSON.parse(localStorage.getItem(key()) || "{}").money || []; }
  function setDaysArr(arr) {
    const s = JSON.parse(localStorage.getItem(key()) || "{}");
    s.money = arr;
    localStorage.setItem(key(), JSON.stringify(s));
    /* Серия дней — главный ежедневный крючок сервиса. Раньше она жила
       только в этом браузере и обнулялась при переходе на телефон. */
    if (typeof PROGRESS !== "undefined") PROGRESS.push("habits");
  }
  function iso(y, m, d) { return `${y}-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`; }
  function todayISO() { const t = new Date(); return iso(t.getFullYear(), t.getMonth(), t.getDate()); }

  /* Сроки этого дня. Повторяющиеся раскрываем на год вперёд: иначе
     «каждый месяц 28-го» было бы видно ровно один раз, а смысл
     повтора как раз в том, чтобы видеть его каждый месяц. */
  function dueOn(dISO) {
    const items = (typeof REM !== "undefined" && REM.items) || [];
    return items.filter(r => {
      if (r.due === dISO) return true;
      if (r.repeat === "once" || dISO < r.due) return false;
      const a = new Date(r.due + "T00:00:00Z"), b = new Date(dISO + "T00:00:00Z");
      const months = (b.getUTCFullYear() - a.getUTCFullYear()) * 12 + (b.getUTCMonth() - a.getUTCMonth());
      const step = r.repeat === "monthly" ? 1 : r.repeat === "quarterly" ? 3 : 12;
      if (months % step !== 0) return false;
      /* 31-е число в коротком месяце съезжает на последний день —
         так же, как это делает сервер при переносе срока. */
      const last = new Date(Date.UTC(b.getUTCFullYear(), b.getUTCMonth() + 1, 0)).getUTCDate();
      return b.getUTCDate() === Math.min(a.getUTCDate(), last);
    });
  }

  /* Карточка дня. Она же — способ поставить срок, не набирая дату
     руками: человек уже смотрит на нужное число. */
  function day(dISO) {
    const due = dueOn(dISO);
    const past = dISO <= todayISO();
    const marked = new Set(daysArr()).has(dISO);
    const human = new Date(dISO + "T00:00:00Z")
      .toLocaleDateString("ru-RU", { day: "numeric", month: "long", year: "numeric", timeZone: "UTC" });

    const list = due.length
      ? `<div style="margin-bottom:14px">${due.map(r => `
          <div class="rem-row">
            <span class="rem-main"><b>${escapeHtml(r.title)}</b>
              ${r.note ? `<span class="rem-meta">${escapeHtml(r.note)}</span>` : ""}</span>
            <span class="rem-side"><button class="btn small danger"
              onclick="CAL.dropDue(${r.id}, '${dISO}')" aria-label="Удалить срок">✕</button></span>
          </div>`).join("")}</div>`
      : `<p class="hint" style="margin-bottom:14px">На этот день ничего не назначено.</p>`;

    MODAL.open(human, `
      ${list}
      <div class="form-group">
        <label for="calNewTitle">Поставить срок на этот день</label>
        <input type="text" id="calNewTitle" maxlength="140" placeholder="Например: аванс по УСН">
      </div>
      <div class="form-group">
        <label for="calNewRepeat">Повторять</label>
        <select id="calNewRepeat">
          <option value="once">один раз</option>
          <option value="monthly">каждый месяц</option>
          <option value="quarterly">каждый квартал</option>
          <option value="yearly">каждый год</option>
        </select>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn" onclick="CAL.addDue('${dISO}')">Поставить срок</button>
        ${past ? `<button class="btn secondary" onclick="CAL.toggle('${dISO}');MODAL.close()">
          ${marked ? "Снять отметку «отложил деньги»" : "Отметить: отложил деньги"}</button>` : ""}
      </div>`);
  }

  async function addDue(dISO) {
    const title = (document.getElementById("calNewTitle").value || "").trim();
    if (!title) return toast("Напишите, о чём напомнить");
    const repeat = document.getElementById("calNewRepeat").value;
    try {
      const r = await API.reminders.create({ title, due: dISO, repeat });
      MODAL.close();
      toast(r.displaced
        ? `Срок поставлен. Место уступил «${r.displaced}»`
        : "Срок поставлен");
      await REM.load();
      render();
    } catch (e) { toast(e.message); }
  }

  async function dropDue(id, dISO) {
    try {
      await API.reminders.remove(id);
      await REM.load();
      render();
      day(dISO);
    } catch (e) { toast(e.message); }
  }

  function streaks() {
    const set = new Set(daysArr());
    const sorted = [...set].sort();
    let best = 0, run = 0, prev = null;
    for (const d of sorted) {
      run = prev && (new Date(d) - new Date(prev)) / 86400000 === 1 ? run + 1 : 1;
      best = Math.max(best, run);
      prev = d;
    }
    let cur = 0;
    const t = new Date();
    if (!set.has(iso(t.getFullYear(), t.getMonth(), t.getDate()))) t.setDate(t.getDate() - 1);
    while (set.has(iso(t.getFullYear(), t.getMonth(), t.getDate()))) { cur++; t.setDate(t.getDate() - 1); }
    return { best, cur, total: sorted.length };
  }

  function render() {
    const grid = document.getElementById("calGrid");
    if (!grid) return;
    const now = new Date();
    if (!view) view = { y: now.getFullYear(), m: now.getMonth() };
    const { y, m } = view;
    const titleEl = document.querySelector(".cal-header h3");
    /* Заголовок называет месяц, а не «Копилку»: в сетке теперь два
       разных смысла — отметки дней и назначенные сроки, и называть её
       по одному из них значит спрятать второй. */
    titleEl.textContent = new Date(y, m, 1)
      .toLocaleDateString("ru-RU", { month: "long", year: "numeric" })
      .replace(/^./, c => c.toUpperCase());

    const set = new Set(daysArr());
    const tISO = todayISO();
    const first = new Date(y, m, 1);
    const cursor = new Date(y, m, 1 - (first.getDay() + 6) % 7); // с понедельника перед 1-м числом

    let html = "";
    for (let i = 0; i < 42; i++) {
      const cy = cursor.getFullYear(), cm = cursor.getMonth(), cd = cursor.getDate();
      const dISO = iso(cy, cm, cd);
      const isOther = cm !== m, isFuture = dISO > tISO;
      let cls = "cal-cell";
      if (isOther) cls += " other";
      if (isFuture) cls += " future"; else cls += " clickable";
      if (set.has(dISO)) cls += " done";
      if (dISO === tISO) cls += " today";
      /* Раньше будущие дни были мертвы: отметить копилку в них нельзя,
         и клик ничего не делал. Но именно на будущие дни и ставят сроки,
         так что теперь кликается любой день. */
      const due = dueOn(dISO);
      if (due.length) cls += " has-due";
      const action = isOther ? `CAL.goto(${cy},${cm})` : `CAL.day('${dISO}')`;
      const marks = (set.has(dISO) ? '<span class="mark">💰</span>' : "")
        + (due.length ? `<span class="cal-due" title="${escapeHtml(due.map(r => r.title).join("; "))}">${
             due.length > 1 ? due.length : ""}</span>` : "");
      html += `<div class="${cls}" title="${dISO}" onclick="${action}">
        <span class="d">${cd}</span>${marks}</div>`;
      cursor.setDate(cursor.getDate() + 1);
    }
    grid.innerHTML = html;

    // Кнопки привычек
    const markedToday = set.has(tISO);
    /* Раньше две кнопки были выключены с пометкой «скоро». Выключенная
       кнопка на готовом продукте читается как недоделка, а обещание
       никто не выполнял. Теперь это живые переходы в те самые разделы. */
    document.getElementById("habitActions").innerHTML = HABITS_LIST.map(h =>
      h.active
        ? `<button class="habit-btn ${markedToday ? "active" : ""}" onclick="CAL.toggleToday()">${h.icon} ${h.label} ${markedToday ? "✓" : ""}</button>`
        : `<a class="habit-btn" href="${h.href}">${h.icon} ${h.label}</a>`
    ).join("");

    // Статистика
    const st = streaks();
    document.getElementById("calStats").innerHTML =
      `<span class="badge">Всего: ${st.total} дн.</span>
       <span class="badge ok">🔥 Серия: ${st.cur} дн.</span>
       <span class="badge pro">🏆 Рекорд: ${st.best} дн.</span>`;

    // Прогресс просматриваемого месяца
    const daysInMonth = new Date(y, m + 1, 0).getDate();
    const inMonth = daysArr().filter(d => {
      const [yy, mm] = d.split("-");
      return +yy === y && +mm === m + 1;
    }).length;
    const pct = Math.round((inMonth / daysInMonth) * 100);
    document.getElementById("calBar").style.width = pct + "%";
    document.getElementById("calPct").textContent = pct + "% месяца";
  }

  function toggle(dISO) {
    if (dISO > todayISO()) return toast("Будущий день отметить нельзя");
    const arr = daysArr();
    const i = arr.indexOf(dISO);
    if (i >= 0) arr.splice(i, 1);
    else { arr.push(dISO); PF.logAction("«Копилка»: отложил деньги " + dISO); }
    setDaysArr(arr);
    render();
    checkStreakReward();
  }

  /* Отметки серии живут в браузере, поэтому подписку за них выдавать нельзя:
     любой дорисовал бы себе 90 дней через DevTools и получил Pro даром.
     Серия остаётся достижением; бонусные дни выдаёт администратор вручную. */
  const STREAK_MILESTONES = { 7: "неделя", 30: "месяц", 90: "три месяца" };
  function checkStreakReward() {
    const cur = streaks().cur;
    if (!PF.user() || !STREAK_MILESTONES[cur]) return;
    const key = "pf_streak_seen_" + PF.user().email;
    const seen = JSON.parse(localStorage.getItem(key) || "[]");
    if (seen.includes(cur)) return;
    localStorage.setItem(key, JSON.stringify([...seen, cur]));
    trackEvent("streak_reward");
    toast(`Серия ${cur} дней — ${STREAK_MILESTONES[cur]} без пропусков. Так держать!`);
  }
  function toggleToday() { toggle(todayISO()); }
  function shift(dir) { const d = new Date(view.y, view.m + dir, 1); view = { y: d.getFullYear(), m: d.getMonth() }; render(); }
  function goToday() { const t = new Date(); view = { y: t.getFullYear(), m: t.getMonth() }; render(); }
  function goto(y, m) { view = { y, m }; render(); }

  return { render, toggle, toggleToday, shift, goToday, goto, day, addDue, dropDue };
})();

function recoLinks(p) {
  const byStatus = {
    self: [["calc.html", "Сравнить налоговые режимы"], ["knowledge.html", "Гид по самозанятости (НПД)"], ["tools.html", "Чек-лист: переход на НПД"]],
    ip: [["calc.html", "Рассчитать УСН против патента"], ["courses.html", "Курс: бухучёт для бизнеса"], ["knowledge.html", "УСН: «Доходы» против «Д−Р»"]],
    ooo: [["knowledge.html", "НДС для УСН с 2025 года"], ["knowledge.html", "Субсидиарная ответственность"], ["courses.html", "Курс: юриспруденция в бизнесе"]],
    person: [["calc.html", "Калькулятор налоговых вычетов"], ["courses.html", "Курс: финансовая грамотность"], ["knowledge.html", "Налоговые вычеты физлиц"]],
    start: [["courses.html", "Курс: финансовая грамотность"], ["knowledge.html", "Регистрация ИП: чек-лист"], ["calc.html", "Какой налоговый режим выбрать"]],
  };
  const byGoal = {
    tax: [["calc.html", "Налоговые калькуляторы"]],
    docs: [["tools.html", "Шаблоны документов"], ["tools.html", "ИИ-генератор документов"]],
    money: [["calc.html", "Счёт на оплату"], ["dashboard.html", "Календарь привычек"]],
    learn: [["courses.html", "Все курсы"]],
  };
  const links = [...(byStatus[p.status] || []), ...(byGoal[p.goal] || [])];
  return [...new Map(links.map(l => [l[1], l])).values()].slice(0, 4);
}
function renderCabinet() {
  const u = PF.user();
  if (!u) return;
  const hist = PF.history();
  const scores = u.scores || {};
  const totalScore = Object.values(scores).reduce((a, b) => a + b, 0);
  const habitsStore = JSON.parse(localStorage.getItem("pf_habits_" + u.email) || "{}");
  const habitDone = (habitsStore.money || []).length;
  const q = PF.quota;
  const quota = PF.isPro()
    ? "👑 Без ограничений"
    : q ? `${q.tool.left} из ${q.tool.limit} · ИИ сегодня: ${q.ai.left} из ${q.ai.limit}`
        : "проверяем…";

  document.getElementById("content").innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:24px">
      <div>
        <h1 style="font-size:clamp(1.5rem,4vw,2rem);margin:0">Привет, ${escapeHtml(u.name)}! 👋</h1>
        <p style="color:var(--muted)">
          Тариф: <span class="badge ${PF.isPro() ? "pro" : ""}">${escapeHtml(u.planTitle || "Старт")}</span>
          ${u.isAdmin ? '<span class="badge">Админ</span>' : ""}
        </p>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        ${u.isAdmin ? '<a href="admin.html" class="btn gold">Админ-панель</a>' : ""}
        <a href="tools.html" class="btn">ИИ-инструменты</a>
        <button class="btn secondary" onclick="SETTINGS.open()">Настройки</button>
        <button class="btn danger" onclick="PF.logout()">Выйти</button>
      </div>
    </div>

    <div id="trialSlot" data-tab="overview"></div>

    <div class="card today" data-tab="overview" id="todayCard">
      <h3>Что сейчас</h3>
      <div id="todayBody" class="today-body"><span class="hint">Смотрим…</span></div>
    </div>

    <div class="grid cols-4" data-tab="overview" style="margin-bottom:28px">
      <div class="card"><div class="stat-value">${hist.length}</div><div class="stat-label">действий всего</div></div>
      <div class="card"><div class="stat-value">${COMP.index()}%</div><div class="stat-label">индекс грамотности</div></div>
      <div class="card"><div class="stat-value">${habitDone}</div><div class="stat-label">дней в «Копилке»</div></div>
      <div class="card"><div class="stat-value">${u.createdAt ? new Date(u.createdAt).toLocaleDateString("ru-RU") : "—"}</div><div class="stat-label">с нами с</div></div>
    </div>

    ${u.profile ? `
    <div class="card" style="margin-bottom:28px" data-tab="overview">
      <h3>Рекомендуем для вас</h3>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        ${recoLinks(u.profile).map(([href, label]) =>
          `<a href="${href}" class="btn small secondary">${label}</a>`).join("")}
      </div>
    </div>` : ""}

    <!-- Копилка: календарь привычек -->
    <div class="card" style="margin-bottom:28px" data-tab="tasks">
      <div class="cal-header">
        <div>
          <h3 style="margin-bottom:6px">Мой месяц</h3>
          <div id="calStats" style="display:flex;gap:8px;flex-wrap:wrap"></div>
        </div>
        <div class="cal-nav">
          <button class="cal-nav-btn" onclick="CAL.shift(-1)" title="Прошлый месяц">‹</button>
          <button class="cal-today-btn" onclick="CAL.goToday()">Сегодня</button>
          <button class="cal-nav-btn" onclick="CAL.shift(1)" title="Следующий месяц">›</button>
        </div>
      </div>
      <div class="habit-actions" id="habitActions" style="margin-bottom:14px"></div>
      <div class="cal-weekdays">
        <span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span>
      </div>
      <div class="cal-grid" id="calGrid"></div>
      <div style="display:flex;align-items:center;gap:12px;margin-top:12px">
        <div class="progress-bar" style="flex:1"><div id="calBar" style="width:0"></div></div>
        <span id="calPct" style="color:var(--muted);font-size:var(--t-sm);font-weight:600;min-width:90px;text-align:right"></span>
      </div>
      <p style="color:var(--muted);font-size:var(--t-sm);margin-top:8px">
        Клик по дню открывает его карточку: что назначено на эту дату и
        кнопка поставить новый срок. Стрелками ‹ › листайте месяцы.
      </p>
    </div>

    <div class="grid cols-2" style="margin-bottom:28px">
      <div class="card" data-tab="account">
        <h3>Подписка и ИИ</h3>
        <p>Тариф: <b>${escapeHtml(u.planTitle || "Старт")}</b>${
          u.proUntil ? ` · до ${new Date(u.proUntil).toLocaleDateString("ru-RU")}` : ""}</p>
        <p style="color:var(--muted)">Осталось: ${quota}</p>

        <div class="points-banner" style="margin:14px 0">
          <div>
            <span class="points-num">${u.points || 0}</span>
            <span class="points-cap">баллов</span>
          </div>
          <p class="hint">1 балл = 1 ₽ скидки при оплате, до половины стоимости.</p>
        </div>

        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <button class="btn gold" onclick="PAY.open()">${
            PF.isPro() ? "Сменить или продлить" : "Выбрать тариф"}</button>
          <button class="btn secondary" onclick="SETTINGS.open('subscription')">Подробнее</button>
        </div>
        <!-- Управление продлением. Оферта (п. 4.5) и раздел «Частые вопросы»
             обещают кнопку отмены в кабинете — значит, она обязана здесь быть,
             а не появиться когда-нибудь потом. -->
        <div id="renewBox" class="renew-box"></div>

        ${(PF.payments || []).length ? `
          <br><h4 style="margin-bottom:8px">История операций</h4>
          <div style="max-height:150px;overflow-y:auto">

/* ============ Раскладка кабинета ============
   Было тринадцать блоков в одну колонку: человек при входе видел стену
   несвязанных карточек, и ни одна не отвечала на вопрос «что мне сделать
   сейчас». Разделение по смыслу решает это надёжнее, чем перерисовка.

   Блоки помечены в шаблоне атрибутом data-tab. Сетки, где карточки
   относятся к разным вкладкам, разбираются поштучно — поэтому личный чат
   и история действий оказываются в разных разделах. */
const CABINET = {
  key: "pf_cab_tab",
  tabs: [
    ["overview", "Обзор"],
    ["tasks", "Дела"],
    ["learn", "Обучение"],
    ["assistant", "Помощник"],
    ["account", "Аккаунт"],
  ],

  layout() {
    const content = document.getElementById("content");
    if (!content || content.querySelector(".cab-tabs")) return;

    const head = content.firstElementChild;   // приветствие и кнопки — вне вкладок
    const buckets = Object.fromEntries(this.tabs.map(([id]) => [id, []]));

    [...content.children].forEach(el => {
      if (el === head) return;
      const own = el.getAttribute("data-tab");
      if (own && buckets[own]) { buckets[own].push(el); return; }

      const kids = [...el.children].filter(k => k.getAttribute("data-tab"));
      if (el.classList.contains("grid") && kids.length) {
        const byTab = {};
        kids.forEach(k => { const t = k.getAttribute("data-tab"); (byTab[t] = byTab[t] || []).push(k); });
        Object.entries(byTab).forEach(([tab, cards]) => {
          const wrap = document.createElement("div");
          wrap.className = el.className;
          cards.forEach(c => wrap.appendChild(c));
          if (buckets[tab]) buckets[tab].push(wrap);
        });
        el.remove();
        return;
      }
      buckets.overview.push(el);
    });

    const bar = document.createElement("div");
    bar.className = "cab-tabs";
    bar.setAttribute("role", "tablist");
    content.insertBefore(bar, head.nextSibling);

    const saved = localStorage.getItem(this.key) || "overview";
    this.tabs.forEach(([id, label]) => {
      const panel = document.createElement("div");
      panel.className = "cab-panel";
      panel.id = "cab-" + id;
      buckets[id].forEach(el => panel.appendChild(el));
      content.appendChild(panel);

      const btn = document.createElement("button");
      btn.className = "cab-tab";
      btn.type = "button";
      btn.setAttribute("role", "tab");
      btn.textContent = label;
      btn.dataset.tab = id;
      btn.onclick = () => this.show(id);
      bar.appendChild(btn);
    });
    this.show(buckets[saved] && buckets[saved].length ? saved : "overview");
  },

  show(id) {
    localStorage.setItem(this.key, id);
    document.querySelectorAll(".cab-panel").forEach(p => p.classList.toggle("on", p.id === "cab-" + id));
    document.querySelectorAll(".cab-tab").forEach(b => {
      const on = b.dataset.tab === id;
      b.classList.toggle("on", on);
      b.setAttribute("aria-selected", on ? "true" : "false");
    });
  },

  /* «Что сейчас» — единственный блок, отвечающий на вопрос, с которым
     человек заходит в кабинет. Пусто — тоже полезный ответ. */
  async today() {
    const box = document.getElementById("todayBody");
    if (!box) return;
    const items = [];

    try {
      const r = await API.reminders.list();
      /* Нужно для подсказки ниже: человеку без единого срока стоит
         предложить именно срок, а не калькулятор. */
      this.hasReminders = (r.reminders || []).length > 0;
      r.reminders.filter(x => x.daysLeft <= 7).slice(0, 3).forEach(x => items.push({
        kind: x.daysLeft <= 1 ? "warn" : "info",
        text: `${x.title} — ${x.daysLeft < 0 ? "просрочено" : x.daysLeft === 0 ? "сегодня" : x.daysLeft === 1 ? "завтра" : "через " + x.daysLeft + " дн."}`,
        go: () => CABINET.show("tasks"),
      }));
    } catch {}

    /* «Моё дело»: сколько отложить и не подходит ли лимит.
       Это самое действенное, что можно показать человеку в кабинете:
       остальные строки сообщают о сервисе, а эта — о его деньгах. */
    try {
      const b = await API.request("/api/book");
      if (!b.profile.regime) {
        items.push({ kind: "info", text: "Настройте «Моё дело» — сервис будет сам считать налог с ваших поступлений",
                     go: () => (location.href = PF.href("book.html")) });
      } else if (b.year.income > 0) {
        const est = BOOK.estimate(b.profile, b.year);
        const lim = BOOK.limitState(b.profile, b.year, b.yearNumber);
        if (est.known) items.push({ kind: "info",
          text: `Отложить на налог и взносы: ${BOOK.RUB(est.tax + est.own)}`,
          go: () => (location.href = PF.href("book.html")) });
        /* Предупреждаем заранее, а не по факту: после превышения лимита
           сделать уже нельзя ничего, налог пересчитают задним числом. */
        if (lim && lim.share > 0.7) items.push({ kind: "warn",
          text: `До лимита режима осталось ${BOOK.RUB(lim.left)} — это ${Math.round((1 - lim.share) * 100)}%`,
          go: () => (location.href = PF.href("book.html")) });
      }
    } catch {}

    /* Не подключён Telegram — предлагаем подключить, а не «добавить срок».
       Человек, который хочет уведомлений, раньше попадал отсюда в календарь:
       там он ставил срок и всё равно не получал ничего, кроме отметки
       на сайте. Настоящие уведомления живут в мессенджере, и вести надо
       туда. Проверку держим отдельно от остальных: она про канал
       доставки, а не про долги и лимиты. */
    try {
      const tg = await API.telegram.status();
      this.tgLinked = Boolean(tg.linked);
      this.tgEnabled = Boolean(tg.enabled);
      if (tg.enabled && !tg.linked && this.hasReminders) {
        items.push({ kind: "info",
          text: "Напоминания приходят только на сайт — подключите Telegram, чтобы видеть их сразу",
          go: () => SETTINGS.open("notify") });
      }
    } catch { /* статус бота не критичен для остального блока */ }

    if (typeof NOTIFY !== "undefined" && NOTIFY.unread) {
      items.push({ kind: "info", text: `Непрочитанных уведомлений: ${NOTIFY.unread}`, go: () => NOTIFY.open() });
    }

    const q = PF.quota;
    if (q && q.tool.limit !== null && q.tool.left === 0) {
      items.push({ kind: "warn", text: "Пробный запуск инструментов израсходован", go: () => PAY.open() });
    } else if (q && q.ai.limit < 300 && q.ai.left <= 1) {
      items.push({ kind: "info", text: `Вопросов ИИ осталось сегодня: ${q.ai.left}`, go: () => PAY.open() });
    }

    /* Пусто — честный ответ, но не полезный: человек посмотрел и ушёл.
       Предлагаем одно конкретное дело, глядя на то, чего он ещё не делал.
       Порядок важен: сначала то, что даёт пользу быстрее всего. */
    if (!items.length) {
      const steps = [];

      /* Порядок здесь и есть ответ на вопрос «где настроить уведомления».
         Сначала канал доставки, потом сроки: срок без канала — это
         запись в календаре, о которой человек узнает, только если сам
         зайдёт и посмотрит. */
      if (this.tgEnabled && !this.tgLinked) {
        steps.push({ text: "Подключите Telegram — туда придут напоминания о сроках",
                     btn: "Подключить Telegram", go: () => SETTINGS.open("notify") });
      }
      if (!this.hasReminders) {
        steps.push({ text: "Поставьте первый срок — напомним заранее, чтобы не пропустить",
                     btn: "Добавить срок", go: () => CABINET.show("tasks") });
      }
      if (!PF.user().profile) {
        steps.push({ text: "Расскажите, кто вы — подскажем, что считать именно вам",
                     btn: "Заполнить профиль", go: () => SETTINGS.open("profile") });
      }
      if (q && q.tool.limit !== null && q.tool.left > 0) {
        steps.push({ text: "Проверьте договор на опасные пункты — один разбор бесплатно",
                     btn: "Разобрать договор", go: () => (location.href = "tools.html") });
      }
      steps.push({ text: "Посчитайте, какой налоговый режим выгоднее",
                   btn: "Открыть калькулятор", go: () => (location.href = "calc.html") });

      const step = steps[0];
      box.innerHTML = `<p class="hint" style="margin-bottom:12px">Срочного ничего нет. ${escapeHtml(step.text)}.</p>`;
      const b = document.createElement("button");
      b.className = "btn small";
      b.type = "button";
      b.textContent = step.btn;
      b.onclick = step.go;
      box.appendChild(b);
      return;
    }
    box.innerHTML = "";
    items.slice(0, 4).forEach(it => {
      const row = document.createElement("button");
      row.className = "today-row " + it.kind;
      row.type = "button";
      row.textContent = it.text;
      row.onclick = it.go;
      box.appendChild(row);
    });
  },
};


/* ============ Мои документы ============

   Раньше это был список текстов в браузере: терялся при чистке, не
   открывался с телефона и ничего не знал об учёте. Человек выставлял
   счёт и через месяц не помнил, оплатили его или нет, — а это и есть
   главный вопрос про счёт.

   Теперь у документа есть состояние. «Оплачен» заносит поступление
   в «Моё дело», и сумма попадает в расчёт налога. Снятая отметка
   запись убирает: иначе первая же исправленная ошибка удвоила бы
   выручку, и узнал бы об этом человек уже из налога.                */
const DOCS = {
  items: [],
  query: "",
  filter: "",
  owed: 0,
  limit: null,

  STATUS: {
    draft:     ["Черновик", "badge"],
    issued:    ["Ждёт оплаты", "badge pro"],
    paid:      ["Оплачен", "badge ok"],
    cancelled: ["Отменён", "badge"],
  },

  async load() {
    const box = document.getElementById("docsList");
    if (!box) return;
    try {
      const d = await API.documents.list(this.filter);
      this.items = d.documents;
      this.owed = d.owed;
      this.limit = d.limit;
      this.render();
    } catch (e) {
      box.innerHTML = `<p class="hint">Не удалось загрузить: ${escapeHtml(e.message)}</p>`;
    }
  },

  search(v) { this.query = v.trim().toLowerCase(); this.render(); },
  setFilter(v) { this.filter = v; this.load(); },

  money(v) {
    return v.toLocaleString("ru-RU", { style: "currency", currency: "RUB", maximumFractionDigits: 2 });
  },

  render() {
    const box = document.getElementById("docsList");
    if (!box) return;

    const list = this.query
      ? this.items.filter(d => (d.title + " " + d.party + " " + d.number).toLowerCase().includes(this.query))
      : this.items;

    /* Сколько денег висит неоплаченным — то, ради чего сюда заходят.
       Показываем над списком, а не внутри: это ответ на вопрос,
       с которым открывают раздел. */
    const head = document.getElementById("docsHead");
    if (head) {
      head.innerHTML = this.owed > 0
        ? `<p style="margin-bottom:10px"><b>Ждёт оплаты: ${this.money(this.owed)}</b>
             <span class="hint">— по выставленным счетам</span></p>`
        : "";
    }

    const tabs = document.getElementById("docsFilter");
    if (tabs) {
      tabs.innerHTML = [["", "Все"], ["issued", "Ждут оплаты"], ["paid", "Оплачены"], ["draft", "Черновики"]]
        .map(([id, label]) =>
          `<button type="button" class="btn small ${this.filter === id ? "" : "secondary"}"
            onclick="DOCS.setFilter('${id}')">${label}</button>`).join("");
    }

    if (!list.length) {
      box.innerHTML = this.query || this.filter
        ? `<p class="hint">Ничего не нашлось. <a href="#" onclick="DOCS.query='';DOCS.setFilter('');return false">Показать все</a></p>`
        : `<div class="empty"><b>Документов пока нет</b>
            <p>Выставите счёт или составьте акт — он останется здесь с номером,
            датой и суммой. Отметите оплату — поступление само попадёт в «Моё дело».</p>
            <a href="docs.html" class="btn small">Составить документ</a></div>`;
      return;
    }

    box.innerHTML = list.map(d => {
      const [label, cls] = this.STATUS[d.status] || this.STATUS.draft;
      return `
        <div class="doc-row">
          <span class="doc-main">
            <b>${escapeHtml(d.title)}${d.number ? " № " + escapeHtml(d.number) : ""}</b>
            <span class="rem-meta">
              ${d.date ? d.date.split("-").reverse().join(".") : new Date(d.createdAt).toLocaleDateString("ru-RU")}
              ${d.party ? " · " + escapeHtml(d.party) : ""}
              ${d.amount ? " · " + this.money(d.amount) : ""}
            </span>
          </span>
          <span class="doc-side">
            <span class="${cls}">${label}</span>
            <button class="btn small secondary" onclick="DOCS.open(${d.id})">Открыть</button>
            ${d.status === "paid"
              ? `<button class="btn small secondary" onclick="DOCS.status(${d.id},'issued')">Снять оплату</button>`
              : `<button class="btn small" onclick="DOCS.status(${d.id},'paid')">Оплачен</button>`}
            <button class="btn small danger" onclick="DOCS.remove(${d.id})" aria-label="Удалить документ">✕</button>
          </span>
        </div>`;
    }).join("") + (this.limit !== null
      ? `<p class="hint">Хранится ${this.items.length} из ${this.limit} на бесплатном тарифе.
         Самые старые черновики вытесняются — выставленные и оплаченные остаются.
         <a href="#" onclick="showPaywall('Полная история документов — в подписке Про');return false">Хранить всё</a></p>`
      : "");
  },

  async open(id) {
    try {
      const d = (await API.documents.one(id)).document;
      MODAL.open(d.title + (d.number ? " № " + d.number : ""), `
        <div style="max-height:50vh;overflow:auto;border:1px solid var(--border);
                    border-radius:10px;padding:12px;margin-bottom:12px">
          <pre style="white-space:pre-wrap;font-family:inherit;margin:0">${escapeHtml(d.content)}</pre>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn" onclick="DOCS.download(${d.id})">Скачать</button>
          <button class="btn secondary" onclick="DOCS.print(${d.id})">Печать</button>
          ${d.status !== "issued" && d.status !== "paid"
            ? `<button class="btn secondary" onclick="DOCS.status(${d.id},'issued');MODAL.close()">Выставлен</button>` : ""}
        </div>`);
      this._last = d;
    } catch (e) { toast(e.message); }
  },

  async _text(id) {
    if (this._last && this._last.id === id) return this._last;
    return (await API.documents.one(id)).document;
  },

  async download(id) {
    const d = await this._text(id);
    const blob = new Blob([d.content], { type: "text/plain;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = (d.title + (d.number ? " " + d.number : "")).replace(/[\\/:*?"<>|]/g, "") + ".txt";
    a.click();
    URL.revokeObjectURL(a.href);
  },

  async print(id) {
    const d = await this._text(id);
    const w = window.open("", "_blank");
    if (!w) return toast("Браузер заблокировал новое окно");
    w.document.write(`<pre style="white-space:pre-wrap;font:14px Georgia,serif;padding:24px">${
      escapeHtml(d.content)}</pre>`);
    w.document.close();
    w.print();
  },

  async status(id, status) {
    try {
      const r = await API.documents.setStatus(id, status);
      if (r.bookOpAdded) toast("Оплата отмечена, поступление занесено в «Моё дело»");
      else if (r.bookOpRemoved) toast("Оплата снята, поступление убрано из учёта");
      else toast("Готово");
      await this.load();
    } catch (e) { toast(e.message); }
  },

  async remove(id) {
    if (!confirm("Удалить документ? Занесённое поступление останется в учёте.")) return;
    try {
      await API.documents.remove(id);
      await this.load();
    } catch (e) { toast(e.message); }
  },
};

/* Старое хранилище документов в браузере. Оставляем только чтение и
   перенос: у людей там лежат бумаги, и терять их при обновлении нельзя.
   Переносим один раз и помечаем, чтобы не задваивать. */
async function migrateLocalDocs() {
  const u = PF.user();
  if (!u) return;
  const flag = "pf_docs_moved_" + u.email;
  if (localStorage.getItem(flag)) return;
  const old = PF.docs();
  if (!old.length) { localStorage.setItem(flag, "1"); return; }
  try {
    for (const d of old.slice(0, 20)) {
      await API.documents.save({
        title: d.title,
        content: d.content,
        date: (d.date || "").slice(0, 10),
      });
    }
    localStorage.setItem(flag, "1");
    toast(`Документы перенесены в кабинет: ${Math.min(old.length, 20)}`);
  } catch { /* не вышло — попробуем в следующий раз, ничего не теряя */ }
}

/* ============ Сроки и напоминания ============
   Раньше сроки жили в localStorage: терялись при смене устройства и не могли
   ничего прислать. Теперь их хранит сервер и рассылает по расписанию. */
/* ============ Личный налоговый календарь ============

   Три вопроса и кнопка. Всё, что нужно знать сервису, чтобы поставить
   человеку его настоящие сроки: кто он, на каком режиме и есть ли
   работники. Больше спрашивать нельзя — мастер из пяти шагов не
   проходят до конца.

   Ответы сохраняем в профиль: спрашивать одно и то же второй раз —
   значит показать, что первый раз мы не слушали.                   */
const TAXCAL = {
  /* Сферу не спрашиваем: она уже есть в ответах знакомства, а лишний
     вопрос стоит дороже, чем кажется — мастера просто не дойдут. */
  answers: { who: "ip", mode: "usn", staff: false, sphere: "" },

  /* Что уже знаем из знакомства при регистрации. */
  /* Соответствие режимов: в «Моём деле» УСН разделена на «Доходы» и
     «Доходы минус расходы», а патент назван ПСН. Для сроков разницы
     между двумя УСН нет — даты у них одни. */
  MODE_FROM_BIZ: { npd: "npd", usn6: "usn", usn15: "usn", psn: "patent", ausn: "ausn", osno: "osno", eshn: "osno" },
  MODE_TO_BIZ: { npd: "npd", usn: "usn6", patent: "psn", ausn: "ausn", osno: "osno", none: "" },

  fromProfile() {
    const u = PF.user() || {};
    const p = u.profile || {};
    const biz = u.biz || {};

    /* Профиль дела главнее: по нему уже считается налог, и сроки
       должны прийти для того же режима. */
    if (["ip", "ooo", "self"].includes(biz.form)) this.answers.who = biz.form;
    if (this.MODE_FROM_BIZ[biz.regime]) this.answers.mode = this.MODE_FROM_BIZ[biz.regime];
    if (biz.workers > 0) this.answers.staff = true;

    /* Что знаем из знакомства — подставляем, чтобы не спрашивать
       второй раз то же самое. */
    if (["ip", "ooo", "self", "person"].includes(p.status)) this.answers.who = p.status;
    if (p.status === "self") this.answers.mode = "npd";
    if (p.status === "person") this.answers.mode = "none";
    if (["ip", "ooo", "self", "person"].includes(p.who)) this.answers.who = p.who;
    if (["usn", "patent", "npd", "osno", "ausn", "none"].includes(p.mode)) this.answers.mode = p.mode;
    if (typeof p.staff === "boolean") this.answers.staff = p.staff;
    if (p.sphere) this.answers.sphere = p.sphere;
  },

  card() {
    const box = document.getElementById("dlPlan");
    if (!box) return;
    const p = (PF.user() || {}).profile || {};
    const set = Boolean(p.mode);
    box.innerHTML = `
      <div style="border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:12px">
        <p style="margin:0 0 10px">
          ${set
            ? "Календарь настроен под ваш режим. Сменили режим или наняли работников — настройте заново."
            : "Не помнить даты наизусть: подберём ваши сроки по режиму и поставим напоминания разом."}
        </p>
        <button class="btn small" onclick="TAXCAL.open()">
          ${set ? "Настроить заново" : "Заполнить мой календарь"}</button>
      </div>`;
  },

  open() {
    this.fromProfile();
    const a = this.answers;
    const pick = (name, list, cur) => list.map(([id, label]) =>
      `<button type="button" class="btn small ${cur === id ? "" : "secondary"}"
        onclick="TAXCAL.set('${name}','${id}')">${label}</button>`).join("");

    MODAL.open("Мой налоговый календарь", `
      <div class="form-group">
        <label id="planWhoLab">Кто вы</label>
        <div style="display:flex;gap:6px;flex-wrap:wrap" role="group" aria-labelledby="planWhoLab">
          ${pick("who", [["ip", "ИП"], ["ooo", "ООО"], ["self", "Самозанятый"], ["person", "Физлицо"]], a.who)}
        </div>
      </div>
      <div class="form-group">
        <label id="planModeLab">Налоговый режим</label>
        <div style="display:flex;gap:6px;flex-wrap:wrap" role="group" aria-labelledby="planModeLab">
          ${pick("mode", [["usn", "УСН"], ["patent", "Патент"], ["npd", "НПД"],
                          ["osno", "Общий (ОСНО)"], ["ausn", "АУСН"], ["none", "Не веду бизнес"]], a.mode)}
        </div>
      </div>
      <div class="form-group">
        <label id="planStaffLab">Есть наёмные работники</label>
        <div style="display:flex;gap:6px;flex-wrap:wrap" role="group" aria-labelledby="planStaffLab">
          ${pick("staff", [["no", "Нет"], ["yes", "Да"]], a.staff ? "yes" : "no")}
        </div>
      </div>
      <div id="planPreview"><p class="hint">Считаем ваши сроки…</p></div>`);
    this.preview();
  },

  set(name, val) {
    this.answers[name] = name === "staff" ? val === "yes" : val;
    /* Самозанятому режим выбирать не из чего, физлицу — тем более.
       Подставляем сами, чтобы человек не думал за нас. */
    if (name === "who" && val === "self") this.answers.mode = "npd";
    if (name === "who" && val === "person") { this.answers.mode = "none"; this.answers.staff = false; }
    this.open();
  },

  /* Показываем список ДО того, как что-то создаём: человек должен
     видеть, на что соглашается, а не обнаружить потом двенадцать
     напоминаний неизвестного происхождения. */
  async preview() {
    const box = document.getElementById("planPreview");
    if (!box) return;
    try {
      const d = await API.reminders.plan(this.answers);
      if (!d.items.length) {
        box.innerHTML = `<p class="hint">Для такого сочетания обязательных сроков нет.
          Поставьте свои — кликом по дню в календаре.</p>`;
        return;
      }
      const limited = d.free !== null && d.items.length > d.free;
      box.innerHTML = `
        <p style="margin-bottom:8px"><b>Ваши сроки — ${d.items.length}:</b></p>
        <div style="max-height:230px;overflow-y:auto;margin-bottom:12px">
          ${d.items.map(i => `<div class="rem-row">
            <span class="rem-main"><b>${escapeHtml(i.title)}</b>
              <span class="rem-meta">${i.due.split("-").reverse().join(".")}</span></span>
          </div>`).join("")}
        </div>
        ${limited ? `<p class="hint">На бесплатном тарифе поставим ${d.free} ближайших.
          Остальные — с подпиской «Про», там же и доставка в Telegram.</p>` : ""}
        <button class="btn" onclick="TAXCAL.apply()">Поставить напоминания</button>`;
    } catch (e) {
      box.innerHTML = `<p class="hint">Не удалось посчитать: ${escapeHtml(e.message)}</p>`;
    }
  },

  async apply() {
    try {
      const d = await API.reminders.planApply(this.answers);
      MODAL.close();
      try { await PF.saveProfile(this.answers); } catch {}
      /* Пишем и в профиль дела: иначе «Моё дело» спросит то же самое
         третий раз, а налог посчитает по старому режиму. */
      try {
        const biz = (PF.user() || {}).biz || {};
        const regime = this.MODE_TO_BIZ[this.answers.mode] ?? "";
        await API.request("/api/book/profile", { method: "POST", body: {
          form: this.answers.who === "person" ? "self" : this.answers.who,
          regime: regime || biz.regime || "",
          workers: this.answers.staff ? Math.max(1, biz.workers || 1) : 0,
        } });
        await API.me();
      } catch {}
      if (d.added) toast(`Поставлено сроков: ${d.added}`);
      else if (d.already) toast("Все ваши сроки уже стоят");
      else toast("Свободных мест для новых напоминаний нет");
      if (d.limited) {
        showPaywall("Остальные сроки вашего календаря и доставка в Telegram — в подписке «Про»");
      }
      await REM.load();
      this.card();
    } catch (e) { toast(e.message); }
  },
};

const REM = {
  items: [],
  presets: [],
  limit: null,

  /* Где человек увидит напоминание. Пишем прямо в разделе сроков:
     именно здесь возникает мысль «а как настроить уведомления», и
     ответ на неё не должен требовать похода по вкладкам. */
  async renderChannel() {
    const box = document.getElementById("dlChannel");
    if (!box) return;
    let tg;
    try { tg = await API.telegram.status(); } catch { return; }
    if (!tg.enabled) return;

    if (tg.linked) {
      box.innerHTML = `<p class="hint" style="margin-bottom:12px">
        <span class="badge ok">Telegram подключён</span>
        напоминания придут и сюда, и в мессенджер.</p>`;
      return;
    }
    box.innerHTML = `
      <div style="border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:12px">
        <p style="margin:0 0 10px">Сейчас напоминания видны <b>только на сайте</b> —
          их надо зайти и посмотреть. Подключите Telegram, и они придут сами.</p>
        <button class="btn small" onclick="SETTINGS.open('notify')">Подключить Telegram</button>
      </div>`;
  },

  async load() {
    const box = document.getElementById("dlList");
    if (!box) return;
    try {
      const d = await API.reminders.list();
      this.items = d.reminders;
      this.limit = d.limit;
      this.render(d);
      this.renderChannel();
      /* Календарь берёт метки из этого же списка — перерисовываем его,
         иначе поставленный срок появился бы в списке, но не в сетке
         месяца, и выглядело бы это как «не сохранилось». */
      if (typeof CAL !== "undefined") CAL.render();
      TAXCAL.card();
      if (!this.presets.length) {
        this.presets = (await API.reminders.presets()).presets;
        this.renderPresets();
      }
    } catch (e) {
      box.innerHTML = `<p class="hint">Не удалось загрузить: ${escapeHtml(e.message)}</p>`;
    }
  },

  render(d) {
    const box = document.getElementById("dlList");
    if (!this.items.length) {
      box.innerHTML = `<div class="empty"><b>Сроков пока нет</b>
        <p>Пропущенный платёж по налогам — это блокировка счёта.
        Добавьте свой срок выше или возьмите готовый из налогового календаря.</p></div>`;
      return;
    }
    const REPEAT_RU = { once: "", monthly: "ежемесячно", quarterly: "ежеквартально", yearly: "ежегодно" };
    box.innerHTML = this.items.map(r => {
      const left = r.daysLeft;
      const cls = left < 0 ? "badge" : left <= 3 ? "badge pro" : left <= 14 ? "badge ok" : "badge";
      const label = left < 0 ? "просрочено" : left === 0 ? "сегодня" : left === 1 ? "завтра" : `через ${left} дн.`;
      return `
        <div class="rem-row">
          <span class="rem-main">
            <b>${escapeHtml(r.title)}</b>
            <span class="rem-meta">
              ${r.due.split("-").reverse().join(".")}
              ${REPEAT_RU[r.repeat] ? " · " + REPEAT_RU[r.repeat] : ""}
              ${r.channel !== "site" ? " · Telegram" : ""}
            </span>
          </span>
          <span class="rem-side">
            <span class="${cls}">${label}</span>
            <button class="btn small danger" onclick="REM.remove(${r.id})" aria-label="Удалить напоминание">✕</button>
          </span>
        </div>`;
    }).join("") + (d.limit !== null
      ? `<p class="hint">Использовано ${d.used} из ${d.limit} на бесплатном тарифе.
         <a href="#" onclick="showPaywall('Больше напоминаний и доставка в Telegram — в подписке «Про»');return false">Снять лимит</a></p>`
      : "");
  },

  renderPresets() {
    const box = document.getElementById("dlPresets");
    if (!box) return;
    box.innerHTML = `<span class="hint" style="width:100%;margin:0 0 4px">Готовые сроки:</span>` +
      this.presets.slice(0, 6).map(p =>
        `<button class="btn small secondary" onclick="REM.addPreset('${p.id}')">${escapeHtml(p.title)}</button>`
      ).join("");
  },

  async add() {
    const title = document.getElementById("dlTitle").value.trim();
    const due = document.getElementById("dlDate").value;
    const repeat = document.getElementById("dlRepeat").value;
    if (!title || !due) return toast("Заполните название и дату");
    try {
      await API.reminders.create({ title, due, repeat, channel: PF.isPro() ? "both" : "site" });
      document.getElementById("dlTitle").value = "";
      document.getElementById("dlDate").value = "";
      toast("Напомним заранее");
      trackEvent("reminder_add");
      this.load();
    } catch (e) {
      if (e.isPaywall) showPaywall(e.message);
      else toast(e.message, "error");
    }
  },

  async addPreset(id) {
    try {
      await API.reminders.addPreset(id);
      toast("Срок добавлен");
      trackEvent("reminder_preset", { id });
      this.load();
    } catch (e) {
      if (e.isPaywall) showPaywall(e.message);
      else toast(e.message, "error");
    }
  },

  async remove(id) {
    try { await API.reminders.remove(id); this.load(); }
    catch (e) { toast(e.message, "error"); }
  },
};

/* Реферальный блок. Восстановлен: при переделке сроков его определение
   попало в вырезаемый кусок, а вызов остался — кабинет падал на ReferenceError.
   Награда теперь в баллах: они дают скидку, а не отданный бесплатно месяц. */
async function renderReferral() {

  if (!box) return;

    const d = await API.referral();
    const rewarded = d.invited.filter(x => x.rewarded).length;
    box.innerHTML = `
      <div class="points-banner">
        <div>
          <span class="points-num">${d.balance}</span>
          <span class="points-cap">баллов на счету</span>
        </div>
        <p class="hint">1 балл = 1 ₽ скидки. Баллами можно оплатить до половины стоимости подписки. Вывести их нельзя.</p>
      </div>

      <div class="ref-code-row">
        <input type="text" id="refLink" value="${escapeHtml(d.link)}" readonly onclick="this.select()">
        <button class="btn small" onclick="copyRef()">Копировать</button>
        ${navigator.share ? '<button class="btn small secondary" onclick="shareRef()">Поделиться</button>' : ""}
      </div>
      <p class="hint">Ваш код: <b>${escapeHtml(d.code)}</b></p>

      <div class="ref-stats">
        <div><b>${d.invited.length}</b><span>приглашено</span></div>
        <div><b>${rewarded}</b><span>дошли до дела</span></div>
        <div><b>${d.earnedPoints}</b><span>баллов заработано</span></div>
      </div>

      ${d.invited.length ? `
        <div class="ref-list">
          ${d.invited.slice(0, 10).map(x => `
            <div class="ref-row">
              <span>${escapeHtml(x.hint)}</span>
              <span class="badge ${x.rewarded ? "ok" : ""}">${x.rewarded ? `+${d.reward.inviterActive} баллов` : "ещё не пользовался"}</span>
            </div>`).join("")}
        </div>` : ""}

      <p class="hint">
        Друг переходит по ссылке и получает <b>${d.reward.inviteeSignup} баллов</b> сразу.
        Вам — <b>${d.reward.inviterActive}</b>, когда он начнёт пользоваться сервисом,
        и ещё <b>${d.reward.inviterPaid}</b>, когда впервые оформит подписку.
        За пустые регистрации баллы не начисляются.
      </p>`;
  } catch (e) {
    box.innerHTML = `<p class="hint">Не удалось загрузить: ${escapeHtml(e.message)}</p>`;
  }
}

/* ============ Личный чат ============ */
function pcAdd(role, text) {
  const d = document.createElement("div");
  d.className = "chat-msg " + role;
  d.textContent = text;
  document.getElementById("pcMessages").appendChild(d);
  document.getElementById("pcMessages").scrollTop = 1e9;
}
async function pcSend() {
  const input = document.getElementById("pcInput");
  const text = input.value.trim();
  if (!text || !PF.user()) return;
  input.value = "";
  pcAdd("user", text);
  const thinking = document.createElement("div");
  thinking.className = "chat-msg bot";
  thinking.textContent = "…";
  document.getElementById("pcMessages").appendChild(thinking);
  const key = "pf_pchat_" + PF.user().email;
  const hist = JSON.parse(localStorage.getItem(key) || "[]");
  const context = hist.slice(-6).map(m => (m.role === "user" ? "Пользователь: " : "Консультант: ") + m.text).join("\n");
  try {
    const res = await API.ai(
      `Ты — личный ИИ-консультант пользователя в кабинете сервиса «ЭкоФин». Отвечай кратко, по делу, на русском. ${context ? "Контекст диалога:\n" + context + "\n\n" : ""}Вопрос: ${text}`,
      { kind: "chat" }
    );
    thinking.textContent = res.text;
    PF.quota = res.quota || PF.quota;
    localStorage.setItem(key, JSON.stringify([...hist, { role: "user", text }, { role: "bot", text: res.text }].slice(-30)));
  } catch (e) {
    thinking.remove();
    if (e.isPaywall) { pcAdd("bot", e.message); showPaywall(e.message); }
    else pcAdd("bot", "Не получилось: " + e.message);
  }
  document.getElementById("pcMessages").scrollTop = 1e9;
}

/* ============ Запуск ============
   Строго в конце файла. renderCabinet обращается к REM, CABINET и другим
   объектам, объявленным через const ниже по тексту: если позвать его
   раньше, весь скрипт падает на «Cannot access before initialization»,
   и всё, что идёт следом, просто не выполняется. */
renderCabinet();
fillCabinet();

document.addEventListener("pf:ready", ({ detail }) => {
  if (!detail.user) { location.href = "auth.html"; return; }
  renderCabinet();
  /* Перерисовка стирает всё, что дозаполнено с сервера, — заполняем
     заново. Раньше плашка пробного и списки пропадали ровно в момент,
     когда приходил пользователь. */
  fillCabinet();
});

/* Всё, что подгружается с сервера уже после отрисовки кабинета.

   Порядок здесь важнее содержания. Сначала — только то, что меняет саму
   разметку (компетенции влияют на проценты и на план развития), потом
   ОДНА перерисовка, и лишь после неё дозаполнение блоков.

   Раньше было наоборот: плашку пробного вставляли первой, а renderCabinet()
   звали в конце — и он стирал всё, что мы только что вставили. Пропадала
   плашка «три дня Про бесплатно», а «Мои расчёты» и «История вопросов»
   навсегда оставались в состоянии «Загружаем…». */
async function fillCabinet() {
  await Promise.all([
    TRIAL.check().catch(() => {}),
    COMP.pull().catch(() => {}),
  ]);
  refillCabinet();
}

/* Перерисовать кабинет и заново наполнить всё, что рисуется поверх
   разметки. Вынесено отдельно, потому что зовётся ещё и после того,
   как с сервера приехал прогресс с другого устройства. */
function refillCabinet() {
  renderCabinet();
  const slot = document.getElementById("trialSlot");
  if (slot) slot.innerHTML = TRIAL.banner();
  PLAN.render();
  RENEW.load();
  SAVED.load();
  HISTORY.load();
  NOTES.load();
  SUMMARY.load();
}

/* Приехала «Копилка» и уроки с другого устройства — показываем их сразу,
   а не после перезагрузки страницы. */
document.addEventListener("pf:progress", refillCabinet);

/* ============ Продление подписки ============

   Обещание «отмена в один клик» стоит на витрине и записано в оферте.
   Обещание без кнопки — введение потребителя в заблуждение, поэтому
   кнопка живёт здесь, а не «появится вместе с оплатой».

   Три состояния, и каждое говорит правду:
   — эквайринг не подключён: списаний нет физически, так и пишем;
   — платил картой: показываем дату следующего списания и выключатель;
   — подписка выдана вручную или промокодом: списывать нечем,
     говорим, что просто закончится в срок.                          */
const RENEW = {
  data: null,

  async load() {
    const box = document.getElementById("renewBox");
    if (!box) return;
    try { this.data = await API.billing.subscription(); }
    catch { box.innerHTML = ""; return; }
    this.render();
  },

  render() {
    const box = document.getElementById("renewBox");
    if (!box || !this.data) return;
    const d = this.data;
    const until = d.until ? new Date(d.until).toLocaleDateString("ru-RU") : "";

    if (!d.active) {
      box.innerHTML = `<p class="hint">Платной подписки нет. Оплата картой
        ${d.billingEnabled ? "доступна" : "пока не подключена"}.</p>`;
      return;
    }
    if (!d.canAutoRenew) {
      box.innerHTML = `<p class="hint">Подписка действует до <b>${until}</b> и просто
        закончится в этот день. Автосписаний нет — оплаты картой по этому доступу не было.</p>`;
      return;
    }
    box.innerHTML = d.autoRenew
      ? `<p class="hint">Продлится автоматически <b>${until}</b>. Спишется столько же,
           сколько при оформлении.</p>
         <button class="btn secondary small" onclick="RENEW.set(false, this)">Отменить подписку</button>`
      : `<p class="hint">Автопродление отключено. Доступ сохранится до <b>${until}</b>,
           дальше ничего не спишется.</p>
         <button class="btn secondary small" onclick="RENEW.set(true, this)">Включить продление</button>`;
  },

  async set(on, btn) {
    if (!on && !confirm("Отключить автопродление? Доступ сохранится до конца оплаченного срока.")) return;
    if (btn) { btn.disabled = true; btn.textContent = "Сохраняем…"; }
    try {
      await API.billing.autoRenew(on);
      this.data.autoRenew = on;
      this.render();
      toast(on ? "Автопродление включено" : "Автопродление отключено. Доступ сохраняется до конца срока");
    } catch (e) {
      toast(e.message, "error");
      this.render();
    }
  },
};

/* ============ Сохранённые расчёты ============
   Посчитал — сохранил — вернулся. Раньше расчёт жил до закрытия
   вкладки, и через месяц человек считал то же самое заново. */
const SAVED = {
  KINDS: {
    regimes: "Налоговые режимы", salary: "Зарплата на руки",
    ipfee: "Взносы ИП", vat: "НДС", fee: "Госпошлина",
    penalty: "Пеня", vacation: "Отпускные", sick: "Больничные",
    dividends: "Дивиденды", deduction: "Вычеты",
  },

  async load() {
    const box = document.getElementById("savedList");
    if (!box) return;
    let d;
    try { d = await API.saved.list(); }
    catch { box.innerHTML = `<p class="hint">Не удалось загрузить.</p>`; return; }

    if (!d.items.length) {
      box.innerHTML = `<p class="hint">Пока пусто.
        Посчитайте что-нибудь в <a href="calc.html">калькуляторах</a> и нажмите «Сохранить в кабинет».</p>`;
      return;
    }

    box.innerHTML = d.items.map(it => `
      <div class="saved-row">
        <div>
          <b>${escapeHtml(it.title)}</b>
          <span class="hint">${escapeHtml(this.KINDS[it.kind] || it.kind)} ·
            ${new Date(it.createdAt).toLocaleDateString("ru-RU")}</span>
          <span class="saved-summary">${escapeHtml(it.summary)}</span>
        </div>
        <div class="saved-actions">
          <a class="btn small secondary" href="calc.html?open=${encodeURIComponent(it.kind)}&saved=${it.id}">Открыть</a>
          <button class="btn small danger" onclick="SAVED.remove(${it.id})">Удалить</button>
        </div>
      </div>`).join("");
  },

  async remove(id) {
    if (!confirm("Удалить расчёт?")) return;
    try { await API.saved.remove(id); this.load(); }
    catch (e) { toast(e.message, "error"); }
  },
};

/* ============ История вопросов ============
   Переписка жила в браузере и терялась при смене устройства.
   Теперь она приходит с сервера — с поиском по словам. */
const HISTORY = {
  timer: null,

  debounced() {
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.load(), 350);
  },

  async load() {
    const box = document.getElementById("histList");
    if (!box) return;
    const q = document.getElementById("histSearch")?.value.trim() || "";
    let d;
    try { d = await API.aiHistory(q); }
    catch { box.innerHTML = `<p class="hint">Не удалось загрузить.</p>`; return; }

    if (!d.items.length) {
      box.innerHTML = q
        ? `<p class="hint">По этому слову ничего не нашлось.</p>`
        : `<p class="hint">Вопросов пока не было. Спросите консультанта — история появится здесь.</p>`;
      return;
    }

    box.innerHTML = d.items.map(it => `
      <details class="hist-item">
        <summary>
          <span>${escapeHtml(it.question)}</span>
          <span class="hint">${new Date(it.createdAt).toLocaleDateString("ru-RU")}${
            it.kind === "tool" ? " · инструмент" : ""}</span>
        </summary>
        <div class="hist-answer">${escapeHtml(it.answer).replace(/\n/g, "<br>")}</div>
      </details>`).join("");
  },
};


/* ============ Следующий шаг в обучении ============
   Смотрим, где показатель ниже всего, и предлагаем ровно одно дело:
   непрочитанную статью по этой теме и тест, который её поднимет.
   Список возможностей человек и так видит — ему нужен следующий шаг. */
const PLAN = {
  /* Что читали — помним локально: для подсказки этого достаточно,
     а серверу лишний журнал ни к чему. */
  readKey() { const x = PF.user(); return "pf_read_" + (x ? x.email : "guest"); },
  read() {
    try { return JSON.parse(localStorage.getItem(this.readKey()) || "[]"); }
    catch { return []; }
  },

  weakest() {
    const all = COMP.all();
    const pairs = Object.keys(COMP.AREAS).map(a => [a, Number(all[a]) || 0]);
    pairs.sort((x, y) => x[1] - y[1]);
    return pairs[0];
  },

  /* Обратное отображение: направление компетенции → область статей. */
  AREA_BY_COMP: {
    tax: "Налоги", contracts: "Договоры", labor: "Работники",
    finance: "Деньги", accounting: "Бизнес",
  },
  TEST_BY_COMP: {
    tax: "taxes", contracts: "law", labor: "labour",
    finance: "finance", accounting: "business",
  },

  render() {
    const box = document.getElementById("planNext");
    if (!box || typeof ARTICLES === "undefined") return;

    const [area, value] = this.weakest();
    const name = COMP.AREAS[area];
    const kbArea = this.AREA_BY_COMP[area];
    const wasRead = this.read();

    const article = ARTICLES.find(a => a.area === kbArea && !wasRead.includes(a.title))
      || ARTICLES.find(a => a.area === kbArea);
    const testKey = this.TEST_BY_COMP[area];

    box.innerHTML = `
      <div class="plan-next">
        <div class="plan-head">
          <span>Слабее всего: <b>${escapeHtml(name)}</b> — ${value}%</span>
          <span class="hint">${COMP.level(value)}</span>
        </div>
        ${article ? `
          <div class="plan-item">
            <div>
              <b>${escapeHtml(article.title)}</b>
              <span class="hint">${escapeHtml(article.summary || "")}</span>
            </div>
            <a class="btn small" href="knowledge.html#a=${encodeURIComponent(article.title)}">Читать</a>
          </div>` : ""}
        <div class="plan-item">
          <div>
            <b>Тест «${escapeHtml((TESTS[testKey] || {}).title || name)}»</b>
            <span class="hint">12 вопросов с разбором каждого ответа</span>
          </div>
          <a class="btn small secondary" href="knowledge.html#test=${testKey}">Пройти</a>
        </div>
      </div>`;
  },
};

/* ============ Блокнот ============
   Сохраняется сам, без кнопки: кнопка «сохранить» в блокноте — лишний
   повод потерять запись. Ждём паузу в наборе, чтобы не слать запрос
   на каждую букву. */
const NOTES = {
  timer: null,

  async load() {
    const box = document.getElementById("notesBox");
    if (!box) return;
    try {
      const d = await API.notes.get();
      box.value = d.text || "";
      this.stamp(d.updatedAt);
    } catch {}
    box.oninput = () => {
      clearTimeout(this.timer);
      document.getElementById("notesState").textContent = "Печатаете…";
      this.timer = setTimeout(() => this.save(), 900);
    };
  },

  async save() {
    const box = document.getElementById("notesBox");
    try {
      const d = await API.notes.save(box.value);
      this.stamp(d.updatedAt);
    } catch {
      document.getElementById("notesState").textContent = "Не удалось сохранить";
    }
  },

  stamp(at) {
    const el = document.getElementById("notesState");
    if (!el) return;
    el.textContent = at
      ? "Сохранено " + new Date(at).toLocaleString("ru-RU", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" })
      : "\u00a0";
  },
};

/* ============ Итоги и достижения ============
   Человек не помнит, что сделал за полгода, и потому не чувствует, за
   что платит. Показываем это его же цифрами. */
const SUMMARY = {
  async load() {
    let d;
    try { d = await API.summary(); } catch { return; }

    const box = document.getElementById("summaryBox");
    if (box) {
      const s = d.stats;
      const cell = (n, label) => `<div class="sum-cell"><b>${n}</b><span>${label}</span></div>`;
      box.innerHTML = `
        <div class="sum-grid">
          ${cell(s.days, plural(s.days, "день с нами", "дня с нами", "дней с нами"))}
          ${cell(s.questions, plural(s.questions, "вопрос консультанту", "вопроса консультанту", "вопросов консультанту"))}
          ${cell(s.analyzed, plural(s.analyzed, "разбор документа", "разбора документов", "разборов документов"))}
          ${cell(s.reminders, plural(s.reminders, "срок под контролем", "срока под контролем", "сроков под контролем"))}
          ${cell(s.savedCalcs, plural(s.savedCalcs, "сохранённый расчёт", "сохранённых расчёта", "сохранённых расчётов"))}
          ${cell(s.remindersSent, plural(s.remindersSent, "напоминание пришло", "напоминания пришло", "напоминаний пришло"))}
        </div>
        ${d.saved > 0 ? `
          <p class="sum-saved">
            Столько же работы у специалиста по средним ставкам стоило бы
            примерно <b>${d.saved.toLocaleString("ru-RU")} ₽</b>.
          </p>
          <p class="hint">Это оценка, а не счёт: консультация от ${d.prices.question} ₽,
            проверка договора от ${d.prices.analyze} ₽, составление документа от ${d.prices.document} ₽.</p>
        ` : `<p class="hint">Начните пользоваться — здесь появится, сколько вы сделали и сколько это стоило бы у специалиста.</p>`}`;
    }

    const bb = document.getElementById("badgeBox");
    if (bb) {
      document.getElementById("badgeCount").textContent = `${d.earned} из ${d.total}`;
      bb.innerHTML = `<div class="badge-grid">${d.badges.map(b => `
        <div class="badge-card ${b.done ? "on" : ""}">
          <b>${escapeHtml(b.title)}</b>
          <span>${escapeHtml(b.text)}</span>
          ${b.done ? `<span class="badge ok">Получено</span>`
                   : `<div class="progress-bar"><div style="width:${Math.round(b.have / b.need * 100)}%"></div></div>
                      <span class="hint">${b.have} из ${b.need}</span>`}
        </div>`).join("")}</div>`;
    }
  },
};
</script>
