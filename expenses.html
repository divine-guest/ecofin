<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дневник трат — ПравоФин</title>
<!-- seo:start -->
<meta name="description" content="Дневник трат ПравоФин: учёт расходов по категориям, месячный лимит и разбор бюджета по правилу 50/30/20.">
<link rel="canonical" href="https://divine-guest.github.io/ecofin/expenses.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="ПравоФин">
<meta property="og:locale" content="ru_RU">
<meta property="og:title" content="Дневник трат — ПравоФин">
<meta property="og:description" content="Дневник трат ПравоФин: учёт расходов по категориям, месячный лимит и разбор бюджета по правилу 50/30/20.">
<meta property="og:url" content="https://divine-guest.github.io/ecofin/expenses.html">
<meta property="og:image" content="https://divine-guest.github.io/ecofin/icon.svg">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0e8f86">
<!-- seo:end -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@500;600;700;800&family=Golos+Text:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css?v=57">
</head>
<body>
<main class="section tint-green">
  <div class="container">
    <div class="section-title">
      <h1>Дневник <span>трат</span></h1>
      <div class="line"></div>
      <p class="subtitle">Записывайте расходы за секунду · статистика по категориям · лимит месяца</p>
    </div>

    <div class="grid cols-3" style="margin-bottom:24px">
      <div class="card"><div class="stat-value" id="exTotal">0 ₽</div><div class="stat-label">расходов в этом месяце</div></div>
      <div class="card"><div class="stat-value" id="exAvg">0 ₽</div><div class="stat-label">в среднем за день</div></div>
      <div class="card">
        <div class="stat-value" id="exLimit">—</div><div class="stat-label">лимит месяца</div>
        <div style="display:flex;gap:6px;margin-top:10px">
          <input type="number" id="exLimInp" placeholder="₽" style="padding:7px 10px">
          <button class="btn small" onclick="setLimit()">Задать</button>
        </div>
      </div>
    </div>

    <div class="grid cols-2">
      <div class="card">
        <h3>Новая запись</h3>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin:12px 0">
          <input type="number" id="exSum" placeholder="Сумма, ₽" style="flex:1;min-width:110px">
          <select id="exCat" style="width:auto"></select>
          <button class="btn" onclick="addExp()">Добавить</button>
        </div>
        <div id="exList" style="max-height:340px;overflow-y:auto"></div>
      </div>
      <div class="card">
        <h3>По категориям, месяц</h3>
        <div id="exStats"></div>
      </div>
    </div>
  </div>
</main>

<script src="js/themes.js?v=57"></script>
<script src="js/api.js?v=57"></script>
<script src="js/app.js?v=57"></script>
<script src="js/ai.js?v=57"></script>
<script src="js/competencies.js?v=57"></script>
<script>
initPage("expenses.html");

const CATS = ["Еда", "Жильё", "Транспорт", "Бизнес", "Здоровье", "Обучение", "Развлечения", "Другое"];
const CAT_COLORS = ["#e86a6a", "#5b8def", "#22c55e", "#0e8f86", "#d9b437", "#8b7cf0", "#f0936a", "#8a94a0"];
const key = () => "pf_exp_" + (PF.user() ? PF.user().email : "guest");
const all = () => JSON.parse(localStorage.getItem(key()) || '{"items":[],"limit":0}');
const save = d => localStorage.setItem(key(), JSON.stringify(d));

document.getElementById("exCat").innerHTML = CATS.map(c => `<option>${c}</option>`).join("");

function monthItems() {
  const now = new Date(), p = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0");
  return all().items.filter(x => x.date.startsWith(p));
}
function render() {
  const items = monthItems();
  const total = items.reduce((s, x) => s + x.sum, 0);
  document.getElementById("exTotal").textContent = total.toLocaleString("ru-RU") + " ₽";
  document.getElementById("exAvg").textContent = Math.round(total / new Date().getDate()).toLocaleString("ru-RU") + " ₽";
  const lim = all().limit;
  document.getElementById("exLimit").textContent = lim ? Math.max(0, lim - total).toLocaleString("ru-RU") + " ₽ осталось" : "не задан";

  document.getElementById("exList").innerHTML = all().items.slice(0, 30).map((x, i) => `
    <p style="padding:7px 0;border-bottom:1px solid var(--border);font-size:var(--t-sm);display:flex;justify-content:space-between;gap:8px">
      <span><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${CAT_COLORS[CATS.indexOf(x.cat)] || "#888"}"></span>
        ${x.cat} · <span style="color:var(--muted)">${x.date.slice(8)}.${x.date.slice(5, 7)}</span></span>
      <span><b>${x.sum.toLocaleString("ru-RU")} ₽</b> <button class="btn small danger" onclick="delExp(${i})">✕</button></span>
    </p>`).join("") || `<p style="color:var(--muted)">Записей нет — добавьте первую сверху.</p>`;

  const byCat = CATS.map((c, i) => [c, items.filter(x => x.cat === c).reduce((s, x) => s + x.sum, 0)]).filter(([, s]) => s > 0);
  document.getElementById("exStats").innerHTML = byCat.length
    ? byCat.sort((a, b) => b[1] - a[1]).map(([c, s]) => `
      <div style="margin:10px 0">
        <div style="display:flex;justify-content:space-between;font-size:var(--t-sm)">
          <span>${c}</span><span style="color:var(--muted)">${s.toLocaleString("ru-RU")} ₽ · ${Math.round(s / total * 100)}%</span>
        </div>
        <div class="progress-bar" style="margin-top:4px"><div style="width:${s / total * 100}%;background:${CAT_COLORS[CATS.indexOf(c)]}"></div></div>
      </div>`).join("") + `<p style="color:var(--muted);font-size:var(--t-xs);margin-top:12px">Правило 50/30/20: обязательное ≤ 50%, желания ≤ 30%, сбережения ≥ 20%.</p>`
    : `<p style="color:var(--muted)">Статистика появится после первых записей месяца.</p>`;
}
function addExp() {
  const sum = +document.getElementById("exSum").value;
  const cat = document.getElementById("exCat").value;
  if (!sum) return toast("Введите сумму");
  const d = all();
  d.items.unshift({ sum, cat, date: new Date().toISOString().slice(0, 10) });
  save(d);
  document.getElementById("exSum").value = "";
  COMP.award("finance", 1);
  PF.logAction("Трата записана: " + sum + " ₽ (" + cat + ")");
  render();
}
function delExp(i) {
  const d = all();
  const now = new Date(), p = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0");
  const monthIdx = d.items.map((x, j) => x.date.startsWith(p) ? j : -1).filter(j => j >= 0)[i];
  d.items.splice(monthIdx, 1);
  save(d); render();
}
function setLimit() {
  const v = +document.getElementById("exLimInp").value || 0;
  const d = all(); d.limit = v; save(d); render();
  toast(v ? "Лимит установлен" : "Лимит снят");
}
render();
</script>
</body>
</html>
