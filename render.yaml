services:
  - type: web
    name: pravofin-ai
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: https://api.aitunnel.ru/v1
      - key: AI_MODEL
        value: deepseek-chat
