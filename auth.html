<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход — ПравоФин</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="section">
  <div class="container" style="max-width: 460px">
    <div class="card">
      <h2 style="margin-bottom:6px">Вход в ПравоФин</h2>
      <p style="color:var(--muted);margin-bottom:14px">Данные хранятся локально в вашем браузере</p>
      <div style="background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:12px 14px;font-size:.82rem;color:var(--muted);margin-bottom:20px">
        Входите с нового устройства (телефон, другой браузер)? Аккаунт там не появится сам —
        зарегистрируйтесь заново с тем же email и перенесите данные: на старом устройстве
        «Настройки → Скачать все мои данные», здесь — «Настройки → Импорт».
      </div>
      <div class="tabs">
        <button class="tab active" id="tabLogin" onclick="switchAuth('login')">Вход</button>
        <button class="tab" id="tabReg" onclick="switchAuth('reg')">Регистрация</button>
      </div>

      <form id="loginForm" onsubmit="doLogin(event)">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="loginEmail" required placeholder="you@mail.ru">
        </div>
        <div class="form-group">
          <label>Пароль</label>
          <input type="password" id="loginPass" required placeholder="••••••">
        </div>
        <button class="btn" style="width:100%">Войти</button>
      </form>

      <form id="regForm" style="display:none" onsubmit="doRegister(event)">
        <div class="form-group">
          <label>Имя</label>
          <input type="text" id="regName" required placeholder="Иван Иванов">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="regEmail" required placeholder="you@mail.ru">
        </div>
        <div class="form-group">
          <label>Пароль (мин. 4 символа)</label>
          <input type="password" id="regPass" required minlength="4" placeholder="••••••">
        </div>
        <button class="btn" style="width:100%">Создать аккаунт</button>
      </form>
    </div>
  </div>
</main>

<script src="js/app.js"></script>
<script src="js/ai.js"></script>
<script>
initPage("auth.html");

function switchAuth(mode) {
  document.getElementById("tabLogin").classList.toggle("active", mode === "login");
  document.getElementById("tabReg").classList.toggle("active", mode === "reg");
  document.getElementById("loginForm").style.display = mode === "login" ? "block" : "none";
  document.getElementById("regForm").style.display = mode === "reg" ? "block" : "none";
}

function doLogin(e) {
  e.preventDefault();
  try {
    PF.login(document.getElementById("loginEmail").value.trim(), document.getElementById("loginPass").value);
    toast("Добро пожаловать!");
    setTimeout(() => location.href = "dashboard.html", 600);
  } catch (err) { toast(err.message, "error"); }
}

function doRegister(e) {
  e.preventDefault();
  try {
    PF.register(
      document.getElementById("regName").value.trim(),
      document.getElementById("regEmail").value.trim(),
      document.getElementById("regPass").value
    );
    toast("Аккаунт создан!");
    setTimeout(() => location.href = "onboarding.html", 600);
  } catch (err) { toast(err.message, "error"); }
}

if (PF.user()) location.href = "dashboard.html";
</script>
</body>
</html>
