<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход — ПравоФин</title>
<!-- seo:start -->
<meta name="description" content="Вход и регистрация в сервисе ПравоФин. Аккаунт синхронизируется между устройствами.">
<link rel="canonical" href="https://divine-guest.github.io/ecofin/auth.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="ПравоФин">
<meta property="og:locale" content="ru_RU">
<meta property="og:title" content="Вход — ПравоФин">
<meta property="og:description" content="Вход и регистрация в сервисе ПравоФин. Аккаунт синхронизируется между устройствами.">
<meta property="og:url" content="https://divine-guest.github.io/ecofin/auth.html">
<meta property="og:image" content="https://divine-guest.github.io/ecofin/icon.svg">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0e8f86">
<meta name="robots" content="noindex, nofollow">
<!-- seo:end -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@500;600;700;800&family=Golos+Text:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css?v=41">
</head>
<body>
<main class="section">
  <div class="container" style="max-width: 460px">
    <div class="card">
      <h1 style="font-size:var(--t-xl);margin-bottom:6px">Вход в ПравоФин</h1>
      <p style="color:var(--muted);margin-bottom:16px">Один аккаунт — все устройства</p>
      <div class="auth-note" id="refBanner" style="display:none"></div>
      <div class="auth-note">
        Аккаунт хранится на сервере: войдите теми же почтой и паролем с телефона,
        планшета или другого компьютера — подписка, документы и прогресс будут на месте.
        Регистрироваться заново не нужно.
      </div>
      <div class="tabs">
        <button class="tab active" id="tabLogin" onclick="switchAuth('login')">Вход</button>
        <button class="tab" id="tabReg" onclick="switchAuth('reg')">Регистрация</button>
      </div>

      <form id="loginForm" onsubmit="doLogin(event)">
        <div class="form-group">
          <label for="loginEmail">Электронная почта</label>
          <input type="email" id="loginEmail" autocomplete="email" inputmode="email" required placeholder="you@mail.ru">
        </div>
        <div class="form-group">
          <label for="loginPass">Пароль</label>
          <input type="password" id="loginPass" required autocomplete="current-password" placeholder="••••••••">
        </div>
        <button class="btn" style="width:100%">Войти</button>
      </form>

      <form id="regForm" style="display:none" onsubmit="doRegister(event)">
        <div class="form-group">
          <label for="regName">Как к вам обращаться</label>
          <input type="text" id="regName" autocomplete="name" required placeholder="Иван Иванов">
        </div>
        <div class="form-group">
          <label for="regEmail">Электронная почта</label>
          <input type="email" id="regEmail" autocomplete="email" inputmode="email" required placeholder="you@mail.ru">
        </div>
        <div class="form-group">
          <label for="regPass">Пароль</label>
          <input type="password" id="regPass" required minlength="8" autocomplete="new-password" placeholder="минимум 8 символов">
        </div>
        <label class="consent">
          <input type="checkbox" id="regConsent" required>
          <span>Я даю согласие на обработку персональных данных и принимаю
            <a href="legal.html#offer" target="_blank" rel="noopener">публичную оферту</a> и
            <a href="legal.html#privacy" target="_blank" rel="noopener">политику конфиденциальности</a>
          </span>
        </label>
        <button class="btn" style="width:100%">Создать аккаунт</button>
        <p class="hint" style="text-align:center;margin-top:10px">
          Забыли пароль? Напишите в поддержку — восстановим доступ.
        </p>
      </form>
    </div>
  </div>
</main>

<script src="js/themes.js?v=41"></script>
<script src="js/api.js?v=41"></script>
<script src="js/app.js?v=41"></script>
<script src="js/ai.js?v=41"></script>
<script>
initPage("auth.html");

function switchAuth(mode) {
  document.getElementById("tabLogin").classList.toggle("active", mode === "login");
  document.getElementById("tabReg").classList.toggle("active", mode === "reg");
  document.getElementById("loginForm").style.display = mode === "login" ? "block" : "none";
  document.getElementById("regForm").style.display = mode === "reg" ? "block" : "none";
}

/* Ключевое отличие от прежней версии: аккаунт создаётся на сервере.
   Войти можно с любого устройства, а подписку и права подделать нельзя. */
function busy(form, on, label) {
  const btn = form.querySelector('button[type="submit"]');
  if (!btn) return;
  if (on) { btn.dataset.label = btn.textContent; btn.disabled = true; btn.textContent = label; }
  else { btn.disabled = false; btn.textContent = btn.dataset.label || label; }
}

async function doLogin(e) {
  e.preventDefault();
  const form = e.target;
  busy(form, true, "Входим…");
  try {
    await API.login(
      document.getElementById("loginEmail").value.trim(),
      document.getElementById("loginPass").value
    );
    trackEvent("login");
    toast("Добро пожаловать!");
    location.href = "dashboard.html";
  } catch (err) {
    toast(err.message, "error");
    busy(form, false, "Войти");
  }
}

async function doRegister(e) {
  e.preventDefault();
  const form = e.target;
  const pass = document.getElementById("regPass").value;
  if (!document.getElementById("regConsent").checked)
    return toast("Без согласия на обработку данных регистрация невозможна", "error");
  if (pass.length < 8) return toast("Пароль минимум 8 символов", "error");
  busy(form, true, "Создаём аккаунт…");
  try {
    await API.register(
      document.getElementById("regName").value.trim(),
      document.getElementById("regEmail").value.trim(),
      pass,
      REF.code
    );
    trackEvent("register", { referred: REF.code ? 1 : 0 });
    toast("Аккаунт создан!");
    location.href = "onboarding.html";
  } catch (err) {
    toast(err.message, "error");
    busy(form, false, "Создать аккаунт");
  }
}

/* Пришли по ссылке-приглашению: показываем, кто позвал, и сразу открываем
   вкладку регистрации — иначе человек упирается в форму входа и уходит. */
const REF = { code: new URLSearchParams(location.search).get("ref") || "" };
if (REF.code) {
  switchAuth("reg");
  API.referralCheck(REF.code)
    .then(d => {
      const el = document.getElementById("refBanner");
      el.style.display = "block";
      el.innerHTML = `<b>${escapeHtml(d.inviter || "Друг")}</b> приглашает вас в ПравоФин.
        Зарегистрируйтесь — и вы оба получите <b>${d.days} дней Pro</b> в подарок.`;
    })
    .catch(() => { REF.code = ""; });
}

if (API.token()) location.href = "dashboard.html";
</script>
</body>
</html>
