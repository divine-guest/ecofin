      <p style="color:var(--muted)">Проверяем доступ…</p>
    </div>
  </div>
</main>

<script src="js/themes.js?v=152"></script>
<script src="js/api.js?v=152"></script>
<script src="js/app.js?v=152"></script>

<!-- Тексты партнёрских предложений: админка соединяет их с настройками
     с сервера, чтобы владелец видел, что именно включает. -->
<script src="js/partners.js?v=152"></script>
<script>
initPage("admin.html");

/* ============ Партнёрские предложения ============

   Почему это в админке, а не в файле с кодом. Чтобы включить
   партнёрку, владельцу нужно было открыть js/partners.js, вписать три
   поля и выкатить сайт. Он не разработчик — значит отложит, и
   заготовка останется заготовкой навсегда.

   Тексты предложений остаются в коде: они часть страницы. Здесь
   только то, что берётся из партнёрского договора и меняется без
   участия разработчика.                                             */
const PART = {
  offers: [],

  async load() {
    const box = document.getElementById("partnerList");
    if (!box) return;
    try {
      const d = await API.request("/api/admin/partners");
      /* Тексты знает клиентский модуль, состояние — сервер.
         Соединяем, чтобы админ видел, что именно он включает. */
      /* Модуль объявлен через const, а не присвоен window: в глобальный
         объект такие имена не попадают, и проверять через window.PARTNERS
         бессмысленно — список молча выходил пустым. */
      const all = typeof PARTNERS !== "undefined" ? PARTNERS.offers : [];
      const texts = Object.fromEntries(all.map(o => [o.id, o]));
      const known = all.map(o => o.id);
      const saved = Object.fromEntries((d.offers || []).map(o => [o.id, o]));
      this.offers = known.map(id => ({
        id,
        title: (texts[id] || {}).title || id,
        lead: (texts[id] || {}).lead || "",
        ...(saved[id] || { url: "", advertiser: "", erid: "", enabled: false, clicks: 0, shows: 0 }),
      }));
      this.render();
    } catch (e) {
      box.innerHTML = `<p class="hint">Не удалось загрузить: ${escapeHtml(e.message)}</p>`;
    }
  },

  render() {
    const box = document.getElementById("partnerList");
    box.innerHTML = this.offers.map(o => {
      const ready = o.url && o.advertiser && o.erid;
      return `
      <div style="border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px">
        <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center">
          <b>${escapeHtml(o.title)}</b>
          <span>
            ${o.enabled ? '<span class="badge ok">Показывается</span>'
                        : ready ? '<span class="badge">Готово, но выключено</span>'
                                : '<span class="badge">Не заполнено</span>'}
            <span class="hint">показов ${o.shows} · переходов ${o.clicks}</span>
          </span>
        </div>
        <p class="hint" style="margin:4px 0 10px">${escapeHtml(o.lead)}</p>

        <div class="form-group">
          <label for="pu_${o.id}">Партнёрская ссылка</label>
          <input type="url" id="pu_${o.id}" value="${escapeHtml(o.url)}" placeholder="https://...">
        </div>
        <div class="form-group">
          <label for="pa_${o.id}">Рекламодатель: наименование и ИНН из договора</label>
          <input type="text" id="pa_${o.id}" value="${escapeHtml(o.advertiser)}"
                 placeholder="ООО «Банк», ИНН 7700000000">
        </div>
        <div class="form-group">
          <label for="pe_${o.id}">Токен erid</label>
          <input type="text" id="pe_${o.id}" value="${escapeHtml(o.erid)}" placeholder="2Vfnxw...">
          <p class="hint">Выдаёт оператор рекламных данных. Часть партнёров
            выдаёт его сама — спросите у них раньше, чем идти в ОРД.</p>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
          <button class="btn small" onclick="PART.save('${o.id}', false)">Сохранить</button>
          ${o.enabled
            ? `<button class="btn small secondary" onclick="PART.save('${o.id}', false, true)">Выключить показ</button>`
            : `<button class="btn small secondary" onclick="PART.save('${o.id}', true)">Сохранить и включить</button>`}
        </div>
      </div>`;
    }).join("") + `
      <p class="hint">Показ без маркировки — штраф до 500 000 ₽ по ст. 14.3 КоАП,
      поэтому включить можно только полностью заполненное предложение.
      Это проверяет сервер, а не форма.</p>`;
  },

  async save(id, enable, disable) {
    const v = pref => (document.getElementById(pref + "_" + id) || {}).value || "";
    const cur = this.offers.find(o => o.id === id) || {};
    try {
      await API.request("/api/admin/partners", {
        method: "POST",
        body: {
          id,
          url: v("pu"), advertiser: v("pa"), erid: v("pe"),
          enabled: disable ? false : (enable || cur.enabled),
        },
      });
      toast(disable ? "Показ выключен" : enable ? "Включено — предложение показывается" : "Сохранено");
      await this.load();
    } catch (e) {
      toast(e.message, "error");
    }
  },
};

const AD = {
  stats: null,
  users: [],
  total: 0,
  q: "",
  offset: 0,
  limit: 50,

  money(n) { return (n || 0).toLocaleString("ru-RU") + " ₽"; },
  date(ts) { return ts ? new Date(ts).toLocaleDateString("ru-RU") : "—"; },
  dateTime(ts) { return ts ? new Date(ts).toLocaleString("ru-RU") : "—"; },

  /* Осталось дней подписки — для колонки «до какого числа». */
  /* Платная подписка — это любой платный уровень, а не только «Про».
     Раньше проверка стояла в трёх местах по отдельности, и «Базовый»
     всюду выглядел как бесплатный. */
  paid(u) {
    return u.isAdmin || u.isOwner || u.plan === "pro" || u.plan === "basic";
  },

  until(u) {
    if (u.isAdmin) return "бессрочно";
    if (!this.paid(u)) return "—";
    if (!u.proUntil) return "бессрочно";
    const days = Math.ceil((u.proUntil - Date.now()) / 86400000);
    return `${this.date(u.proUntil)} (${days} дн.)`;
  },

  async load() {
    const [stats, list] = await Promise.all([
      API.admin.stats(),
      API.admin.users(this.q, this.limit, this.offset),
    ]);
    this.stats = stats;
    this.users = list.users;
    this.total = list.total;
    this.render();
  },

  render() {
    const s = this.stats;
    const meOwner = PF.isOwner();
    document.getElementById("content").innerHTML = `
      <div class="section-title" style="margin-bottom:24px">
        <h1>Админ-<span>панель</span></h1>
        <div class="line"></div>
        <p class="subtitle">
          Вы вошли как ${escapeHtml(PF.user().name)} —
          <span class="badge ${meOwner ? "pro" : ""}">${meOwner ? "владелец сервиса" : "администратор"}</span>
        </p>
      </div>

      <div class="grid cols-4" style="margin-bottom:8px">
        <div class="card"><div class="stat-value">${s.users}</div><div class="stat-label">пользователей</div></div>
        <div class="card"><div class="stat-value">${s.pro}</div><div class="stat-label">с активной «Про»</div></div>
        <div class="card"><div class="stat-value">${this.money(s.revenue)}</div><div class="stat-label">выручка всего</div></div>
        <div class="card"><div class="stat-value">${this.money(s.revenue30)}</div><div class="stat-label">выручка за 30 дней</div></div>
      </div>
      <div class="grid cols-4" style="margin-bottom:24px">
        <div class="card"><div class="stat-value">${s.new30}</div><div class="stat-label">новых за 30 дней</div></div>
        <div class="card"><div class="stat-value">${s.active7}</div><div class="stat-label">заходили за неделю</div></div>
        <div class="card"><div class="stat-value">${s.paidCount}</div><div class="stat-label">оплат картой</div></div>
        <div class="card"><div class="stat-value">${s.aiTotal}</div><div class="stat-label">обращений к ИИ</div></div>
      </div>

      <div class="card" style="margin-bottom:20px">
        <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
          <input type="text" id="adSearch" placeholder="Поиск по email или имени"
                 value="${escapeHtml(this.q)}" style="flex:1;min-width:220px"
                 onkeydown="if(event.key==='Enter')AD.search()">
          <button class="btn small" onclick="AD.search()">Найти</button>
          ${this.q ? '<button class="btn small secondary" onclick="AD.clearSearch()">Сбросить</button>' : ""}
          <span style="color:var(--muted);font-size:var(--t-sm);margin-left:auto">
            показано ${this.users.length} из ${this.total}
          </span>
        </div>
      </div>

      <div class="card" style="overflow-x:auto">
        <h3 style="margin-bottom:14px">Пользователи</h3>
        <table class="cmp-table" style="width:100%;min-width:900px">
          <tr style="font-size:var(--t-xs);color:var(--muted)">
            <th style="text-align:left">Пользователь</th>
            <th>Статус</th>
            <th>Подписка до</th>
            <th>Оплачено</th>
            <th>ИИ</th>
            <th>Регистрация</th>
            <th style="text-align:right">Действия</th>
          </tr>
          ${this.users.map(u => this.row(u, meOwner)).join("")}
        </table>
        ${this.total > this.limit ? `
          <div style="display:flex;gap:10px;justify-content:center;margin-top:16px">
            <button class="btn small secondary" ${this.offset === 0 ? "disabled" : ""} onclick="AD.page(-1)">← Назад</button>
            <button class="btn small secondary" ${this.offset + this.limit >= this.total ? "disabled" : ""} onclick="AD.page(1)">Вперёд →</button>
          </div>` : ""}
      </div>

      <div class="card" style="margin-top:20px" id="qaCard">
        <h3 style="margin-bottom:6px">Вопросы в общую ленту <span class="badge" id="qaCount">0</span></h3>
        <p style="color:var(--muted);font-size:var(--t-sm);margin-bottom:14px">
          Люди разрешили опубликовать свой разбор. Проверьте, не осталось ли в вопросе
          личного — сумм, имён, реквизитов. Формулировку вопроса можно поправить под то,
          как люди ищут: именно она попадёт в поиск.
        </p>
        <div id="qaQueue"><p class="hint">Загружаем…</p></div>
      </div>

      <div class="card" style="margin-top:20px">
        <h3 style="margin-bottom:6px">Выдать подписку вручную</h3>
        <p style="color:var(--muted);font-size:var(--t-sm);margin-bottom:14px">
          Подарочная подписка не попадает в выручку, но видна в журнале операций.
          Если подписка уже есть — срок продлевается, а не перезаписывается.
        </p>
        <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">
          <div class="form-group" style="margin:0;flex:1;min-width:220px">
            <label for="grantEmail">Email пользователя</label>
            <input type="text" id="grantEmail" placeholder="user@example.com">
          </div>
          <div class="form-group" style="margin:0">
            <label for="grantTier">Тариф</label>
            <select id="grantTier">
              <option value="pro">Про — 690 ₽/мес</option>
              <option value="basic">Базовый — 290 ₽/мес</option>
            </select>
          </div>
          <div class="form-group" style="margin:0">
            <label for="grantPlan">Срок</label>
            <select id="grantPlan" onchange="document.getElementById('grantDaysBox').style.display=this.value==='days'?'block':'none'">
              <option value="month">Месяц (30 дн.)</option>
              <option value="year">Год (365 дн.)</option>
              <option value="days">Своё число дней</option>
            </select>
          </div>
          <div class="form-group" id="grantDaysBox" style="margin:0;display:none">
            <label for="grantDays">Дней</label>
            <input type="number" id="grantDays" min="1" max="3650" value="14" style="max-width:110px">
          </div>
          <button class="btn gold" onclick="AD.grant()">Выдать</button>
        </div>
      </div>

      <div class="card" style="margin-top:20px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
          <h3>Журнал операций</h3>
          <button class="btn small secondary" onclick="AD.loadPayments()">Показать</button>
        </div>
        <div id="payLog" style="color:var(--muted);font-size:var(--t-sm)">Нажмите «Показать», чтобы загрузить последние 200 операций.</div>
      </div>

      <div class="card" style="margin-top:20px">
        <h3 style="margin-bottom:6px">Напоминания</h3>
        <p style="color:var(--muted);font-size:var(--t-sm);margin-bottom:12px">
          Обычно рассылку запускает расписание раз в час. Ручной прогон нужен,
          чтобы проверить настройку или разослать сразу после правки сроков.
        </p>
        <button class="btn small secondary" onclick="AD.runReminders()">Прогнать рассылку сейчас</button>
        <div id="remRun" style="margin-top:10px;color:var(--muted);font-size:var(--t-sm)"></div>
      </div>

      <div class="card" style="margin-top:20px" id="partners">
        <h3 style="margin-bottom:6px">Партнёрские предложения</h3>
        <p style="color:var(--muted);font-size:var(--t-sm);margin-bottom:12px">
          Доход, который не требует подписчиков: банк платит за одного
          приведённого ИП больше, чем стоит годовая подписка. Раньше
          ссылки правились в файле с кодом и требовали выкатки сайта.
        </p>
        <div id="partnerList"><p class="hint">Загружаем…</p></div>
      </div>

      <div class="card" style="margin-top:20px">
        <h3 style="margin-bottom:10px">Права доступа</h3>
        <p style="color:var(--muted);font-size:var(--t-sm);line-height:1.7">
          Владельцы сервиса: ${s.owners.map(e => `<b>${escapeHtml(e)}</b>`).join(", ") || "—"}<br>
          ${s.envAdmins.length ? `Админы из настроек: ${s.envAdmins.map(e => escapeHtml(e)).join(", ")}<br>` : ""}
          ${meOwner
            ? "Вы можете выдавать и снимать права администратора кнопкой в таблице. Список владельцев меняется только в настройках воркера."
            : "Выдавать права администратора может только владелец сервиса."}
        </p>
      </div>`;
  },

  row(u, meOwner) {
    const me = PF.user().email === u.email;
    const badge = u.isOwner
      ? '<span class="badge pro">владелец</span>'
      : u.isAdmin ? '<span class="badge">админ</span>'
      : u.plan === "pro" ? '<span class="badge ok">Про</span>'
      : u.plan === "basic" ? '<span class="badge ok">Базовый</span>'
      : '<span class="badge">Старт</span>';

    return `
      <tr>
        <td>
          <b>${escapeHtml(u.name)}</b>${me ? ' <span style="color:var(--muted)">(это вы)</span>' : ""}<br>
          <span style="color:var(--muted);font-size:var(--t-sm)">${escapeHtml(u.email)}</span>
        </td>
        <td style="text-align:center">${badge}</td>
        <td style="text-align:center;font-size:var(--t-sm)">${this.until(u)}</td>
        <td style="text-align:center">${u.paid ? this.money(u.paid) : "—"}</td>
        <td style="text-align:center">${u.aiTotal || 0}</td>
        <td style="text-align:center;font-size:var(--t-sm);color:var(--muted)">${this.date(u.createdAt)}</td>
        <td style="text-align:right;white-space:nowrap">
          <button class="btn small secondary" onclick="AD.card('${encodeURIComponent(u.email)}')">Карточка</button>
          <button class="btn small secondary" onclick="AD.resetPassword('${encodeURIComponent(u.email)}')">Сбросить пароль</button>
          ${u.isAdmin ? "" : `
            <button class="btn small gold" onclick="AD.quickGrant('${encodeURIComponent(u.email)}')">+ Подписка</button>
            ${this.paid(u) && !u.isAdmin ? `<button class="btn small secondary" onclick="AD.revoke('${encodeURIComponent(u.email)}')">Снять</button>` : ""}
          `}
          ${meOwner && !u.isOwner && !me ? `
            <button class="btn small ${u.isAdmin ? "secondary" : ""}" onclick="AD.setRole('${encodeURIComponent(u.email)}', ${u.isAdmin ? "false" : "true"})">
              ${u.isAdmin ? "Снять админа" : "Сделать админом"}
            </button>` : ""}
          ${!u.isAdmin && !me ? `<button class="btn small danger" onclick="AD.remove('${encodeURIComponent(u.email)}')">Удалить</button>` : ""}
        </td>
      </tr>`;
  },

  search() { this.q = document.getElementById("adSearch").value.trim(); this.offset = 0; this.reload(); },
  clearSearch() { this.q = ""; this.offset = 0; this.reload(); },
  page(dir) { this.offset = Math.max(0, this.offset + dir * this.limit); this.reload(); },

  async reload() {
    try { await this.load(); } catch (e) { toast(e.message, "error"); }
  },

  async act(fn, okMsg) {
    try {
      await fn();
      toast(okMsg);
      await this.load();
    } catch (e) { toast(e.message, "error"); }
  },

  /* ---------- Очередь публичной ленты ---------- */

  async qaLoad() {
    const box = document.getElementById("qaQueue");
    if (!box) return;
    let d;
    try { d = await API.admin.qaPending(); }
    catch { box.innerHTML = `<p class="hint">Не удалось загрузить.</p>`; return; }

    document.getElementById("qaCount").textContent = d.total;
    if (!d.items.length) {
      box.innerHTML = `<p class="hint">Пока нечего проверять. Разборы появятся, когда люди начнут их предлагать.</p>`;
      return;
    }

    box.innerHTML = "";
    d.items.forEach(it => {
      const el = document.createElement("div");
      el.className = "qa-review";
      el.innerHTML = `
        <label>Вопрос — попадёт в поиск, можно поправить</label>
        <textarea rows="2" data-q="${it.id}">${escapeHtml(it.question)}</textarea>
        <div class="qa-review-row">
          <select data-topic="${it.id}">
            ${["Налоги","Договоры","Работники","ИП и ООО","Самозанятость","Проверки и штрафы","Деньги и счета","Общее"]
              .map(t => `<option${t === it.topic ? " selected" : ""}>${t}</option>`).join("")}
          </select>
          <span class="hint">предложил: ${escapeHtml(it.email)}</span>
        </div>
        <details style="margin:10px 0">
          <summary style="cursor:pointer;font-size:var(--t-sm)">Показать ответ целиком</summary>
          <div class="qa-review-answer">${escapeHtml(it.answer).replace(/\n/g, "<br>")}</div>
        </details>
        <div class="qa-review-row">
          <button class="btn small" onclick="AD.qaDecide(${it.id}, 'publish')">Опубликовать</button>
          <button class="btn small secondary" onclick="AD.qaDecide(${it.id}, 'reject')">Отклонить</button>
        </div>`;
      box.appendChild(el);
    });
  },

  async qaDecide(id, action) {
    const q = document.querySelector(`[data-q="${id}"]`)?.value.trim();
    const topic = document.querySelector(`[data-topic="${id}"]`)?.value;
    try {
      await API.admin.qaDecide(id, action, q, topic);
      toast(action === "publish" ? "Опубликовано" : "Отклонено");
      this.qaLoad();
    } catch (e) { toast(e.message, "error"); }
  },

  grant() {
    const email = document.getElementById("grantEmail").value.trim();
    if (!email) return toast("Укажите email");
    const plan = document.getElementById("grantPlan").value;
    const days = Number(document.getElementById("grantDays").value) || 0;
    const tier = document.getElementById("grantTier").value;
    const name = tier === "basic" ? "Базовый" : "Про";
    this.act(() => API.admin.grant(email, plan, days, tier), `«${name}» выдан: ${email}`);
  },

  quickGrant(enc) {
    const email = decodeURIComponent(enc);
    const tier = prompt(`Какой тариф выдать ${email}?\nВведите: pro — «Про», basic — «Базовый».`, "pro");
    if (tier === null) return;
    const t = tier.trim().toLowerCase() === "basic" ? "basic" : "pro";
    const tName = t === "basic" ? "Базовый" : "Про";
    const choice = prompt(`Выдать «${tName}» пользователю ${email}.\nВведите: month — месяц, year — год, либо число дней.`, "month");
    if (!choice) return;
    const v = choice.trim().toLowerCase();
    if (v === "month" || v === "year") return this.act(() => API.admin.grant(email, v, 0, t), `«${tName}» выдан: ${email}`);
    const days = Number(v);
    if (!days || days < 1) return toast("Не понял срок");
    this.act(() => API.admin.grant(email, "days", days, t), `«${tName}» на ${days} дн. выдан: ${email}`);
  },

  revoke(enc) {
    const email = decodeURIComponent(enc);
    if (!confirm(`Снять подписку «Про» у ${email}?`)) return;
    this.act(() => API.admin.revoke(email), "Подписка снята");
  },

  setRole(enc, makeAdmin) {
    const email = decodeURIComponent(enc);
    const msg = makeAdmin
      ? `Выдать права администратора пользователю ${email}?\n\nОн получит доступ к списку пользователей, выручке и выдаче подписок.`
      : `Снять права администратора у ${email}?`;
    if (!confirm(msg)) return;
    this.act(() => API.admin.setRole(email, makeAdmin ? "admin" : "user"),
      makeAdmin ? "Права администратора выданы" : "Права администратора сняты");
  },

  remove(enc) {
    const email = decodeURIComponent(enc);
    if (!confirm(`Удалить аккаунт ${email}? Действие необратимо.`)) return;
    if (prompt('Для подтверждения введите слово "удалить"') !== "удалить") return toast("Отменено");
    this.act(() => API.admin.deleteUser(email), "Пользователь удалён");
  },

  /* Пока почта не подключена, это единственный способ вернуть человеку доступ,
     если он забыл пароль. Пароль показывается один раз. */
  async resetPassword(enc) {
    const email = decodeURIComponent(enc);
    if (!confirm(`Сбросить пароль пользователю ${email}?

Он выйдет из аккаунта на всех устройствах, а вы получите временный пароль, который нужно ему передать.`)) return;
    try {
      const r = await API.admin.resetPassword(email);
      prompt(`Временный пароль для ${email}.
Скопируйте и передайте лично — второй раз он не покажется.
Посоветуйте сменить его в настройках после входа.`, r.tempPassword);
      await this.load();
    } catch (e) { toast(e.message, "error"); }
  },

  async card(enc) {
    const email = decodeURIComponent(enc);
    try {
      const d = await API.admin.card(email);
      const u = d.user;
      alert(
        `${u.name} <${u.email}>\n` +
        `Роль: ${u.role} | Тариф: ${u.planTitle || u.plan} | Подписка до: ${this.until(u)}\n` +
        `Регистрация: ${this.dateTime(u.createdAt)}\n` +
        `Последний вход: ${this.dateTime(u.lastLoginAt)}\n` +
        `Пробных запусков израсходовано: ${u.toolUses}\n\n` +
        `ОПЛАТЫ (${d.payments.length}):\n` +
        (d.payments.map(p => `  ${this.date(p.created_at)} — ${p.amount} ₽ · ${p.plan} · ${p.source} · ${p.status}` +
          (p.granted_by ? ` (выдал ${p.granted_by})` : "")).join("\n") || "  нет") +
        `\n\nПОСЛЕДНИЕ ДЕЙСТВИЯ:\n` +
        (d.actions.slice(0, 15).map(a => `  ${this.dateTime(a.at)} — ${a.text}`).join("\n") || "  нет")
      );
    } catch (e) { toast(e.message, "error"); }
  },

  async runReminders() {
    const box = document.getElementById("remRun");
    box.textContent = "Прогоняем…";
    try {
      const r = await API.request("/api/admin/run-reminders", { method: "POST" });
      box.textContent = `Отправлено уведомлений: ${r.sent}. Перенесено повторяющихся сроков: ${r.rolled}.`;
    } catch (e) { box.textContent = "Не удалось: " + e.message; }
  },

  async loadPayments() {
    const box = document.getElementById("payLog");
    box.textContent = "Загружаем…";
    try {
      const d = await API.admin.payments();
      if (!d.payments.length) {
        box.innerHTML = `<div class="empty"><b>Операций пока нет</b>
          <p>Здесь появятся оплаты, промокоды и подписки, выданные вручную.</p></div>`;
        return;
      }
      box.innerHTML = `
        <table class="cmp-table" style="width:100%">
          <tr style="font-size:var(--t-xs);color:var(--muted)">
            <th style="text-align:left">Дата</th><th style="text-align:left">Пользователь</th>
            <th>Сумма</th><th>План</th><th>Источник</th><th>Статус</th>
          </tr>
          ${d.payments.map(p => `
            <tr>
              <td style="font-size:var(--t-sm)">${this.dateTime(p.created_at)}</td>
              <td style="font-size:var(--t-sm)">${escapeHtml(p.email)}${p.granted_by ? `<br><span style="color:var(--muted);font-size:var(--t-xs)">выдал ${escapeHtml(p.granted_by)}</span>` : ""}</td>
              <td style="text-align:center">${p.amount ? this.money(p.amount) : "—"}</td>
              <td style="text-align:center">${escapeHtml(String(p.plan))}</td>
              <td style="text-align:center">${escapeHtml(p.source)}</td>
              <td style="text-align:center"><span class="badge ${p.status === "succeeded" ? "ok" : ""}">${escapeHtml(p.status)}</span></td>
            </tr>`).join("")}
        </table>`;
    } catch (e) { box.textContent = "Не удалось загрузить: " + e.message; }
  },
};

/* Ждём подтверждения сессии сервером: рисовать админку по кэшу нельзя. */
document.addEventListener("pf:ready", async ({ detail }) => {
  const denied = `
    <div class="card" style="text-align:center">
      <h3 style="margin-bottom:10px">Доступ закрыт</h3>
      <p style="color:var(--muted)">Этот раздел доступен только администраторам сервиса.</p>
      <br><a href="index.html" class="btn secondary">На главную</a>
    </div>`;

  if (!detail.user) {
    document.getElementById("content").innerHTML = `
      <div class="card" style="text-align:center">
        <p>Требуется вход.</p><br><a href="auth.html" class="btn">Войти</a>
      </div>`;
    return;
  }
  if (!detail.user.isAdmin) {
    document.getElementById("content").innerHTML = denied;
    return;
  }
  try {
    await AD.load();
    PART.load();
  } catch (e) {
    document.getElementById("content").innerHTML = e.status === 403
      ? denied
      : `<div class="card"><p>Не удалось загрузить данные: ${escapeHtml(e.message)}</p></div>`;
  }
});

AD.qaLoad();
</script>
</body>
</html>
