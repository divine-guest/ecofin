# Настройка nginx для ПравоФина.
#
# Этот файл копируется на сервер как есть, из репозитория. Раньше он был
# вписан внутрь cloud-init, и там из строки try_files пропала переменная
# $uri: nginx отказался запускаться, а сайт отдавал заглушку. Обычный файл
# в репозитории такого сделать не может — что в git, то и на диске.
#
# Один домен на всё: статика отдаётся с диска, /api уходит в Node.
# Это заодно убирает CORS — браузер и сервер на одном адресе.

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;

  root /opt/pravofin/repo;
  index index.html;
  charset utf-8;

  client_max_body_size 25m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;
  gzip_min_length 1024;

  # Наружу отдаём только сайт.
  #
  # Корень nginx — это весь репозиторий: иначе пришлось бы раскладывать
  # файлы по папкам при каждом обновлении. Расплата в том, что рядом со
  # страницами лежит серверная часть, а в ней worker/.env с ключами.
  #
  # Сейчас его спасают права 600 — nginx просто не может его прочитать и
  # отдаёт 403. Но это удача, а не защита: достаточно одной строки chmod
  # в скрипте, и ключи уедут первому, кто попросит. Поэтому закрываем явно.
  # Исключение: по этому пути Let's Encrypt проверяет, что домен наш.
  # Без него запрет на скрытые файлы закрыл бы выпуск сертификата, и
  # HTTPS не включился бы никогда — а понять почему было бы непросто.
  # Префикс ^~ важен: он выигрывает у запретов ниже независимо от порядка.
  location ^~ /.well-known/acme-challenge/ { allow all; }

  location ~ ^/(worker|tests|docs)/ { deny all; }
  location ~ /\.                    { deny all; }
  location ~* \.(sh|mjs|py|ya?ml|toml|sql|log|db)$ { deny all; }

  # Ресурсы подключаются с ?v=НОМЕР, поэтому их можно кэшировать надолго:
  # смена версии сама делает адрес новым.
  location ~* \.(css|js|png|svg|webmanifest|woff2)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri $uri/ =404;
  }

  location /api/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;

    # Адрес посетителя. Перезаписываем обязательно: если пропустить то,
    # что прислал браузер, ограничение по частоте обходится подделкой
    # заголовка.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $host;

    # Ответ ИИ готовится до полутора минут — обычных 60 секунд мало.
    proxy_read_timeout 200s;
    proxy_send_timeout 200s;
    proxy_buffering off;
  }

  location / {
    try_files $uri $uri/ /404.html;
  }
}
