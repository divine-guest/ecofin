# ============ ЭкоФин — заголовки безопасности ============
#
# До этого файла сайт не отдавал ни одного такого заголовка. Для страницы
# с оплатой, личным кабинетом и кнопкой «удалить аккаунт» это не мелочь:
# без них браузер не знает, что ему запрещено, и разрешает всё.
#
# Файл подключается двумя способами сразу, и это не дублирование:
#
#   1. /etc/nginx/conf.d/  — на уровне http. Так заголовки доходят и до той
#      настройки, которую переписал certbot: её установщик больше не трогает
#      (иначе снёс бы сертификат), поэтому обычная правка nginx.conf в
#      репозиторий до сервера просто не доехала бы.
#
#   2. внутрь блока со статикой в nginx.conf. Правило nginx: как только в
#      блоке появился хоть один add_header, все унаследованные пропадают.
#      В блоке css/js стоит свой Cache-Control — без повторного include
#      скрипты и стили остались бы вообще без заголовков.
#
# Слово always обязательно: без него заголовок не ставится на ответы
# с ошибкой, а страница 404 — такая же страница, и её точно так же можно
# засунуть в чужой фрейм.

# Браузер не должен «догадываться» о типе файла. Иначе картинку, в которую
# записан скрипт, он может исполнить как скрипт.
add_header X-Content-Type-Options "nosniff" always;

# Запрет показывать сайт внутри чужого фрейма. Без этого мошеннический сайт
# накладывает свою страницу поверх нашей, и человек, думая что нажимает
# «получить приз», нажимает нашу кнопку «оплатить» или «удалить аккаунт».
# X-Frame-Options — для старых браузеров, frame-ancestors ниже — для новых.
add_header X-Frame-Options "DENY" always;

# Чужому сайту уходит только имя нашего домена, без пути. Иначе адрес вида
# /dashboard.html#reminders утекал бы в чужую статистику.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Камера, микрофон и местоположение сайту не нужны — закрываем.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# Год ходить только по https. Один раз зайдя, браузер больше не пойдёт по
# http даже если человек напечатает адрес руками — а именно этим пользуются,
# чтобы перехватить пароль в чужом wi-fi.
# includeSubDomains намеренно нет: поддоменов у сервиса пока не существует,
# а обещание, данное браузеру, отзывается только через год.
add_header Strict-Transport-Security "max-age=31536000" always;

# Что странице вообще разрешено загружать и куда обращаться.
#
# 'unsafe-inline' стоит честно и осознанно: на страницах есть onclick
# и вставленные прямо в разметку скрипты — их сотни, и переписывание всех
# ради строгой политики сейчас принесёт больше поломок, чем защиты.
# Остальное закрыто, и главное здесь — script-src: даже если в текст
# страницы удастся протолкнуть <script src="чужой-адрес">, он не загрузится.
#
# mc.yandex.ru и yastatic.net вписаны заранее, под счётчик Метрики: он
# включается одной строкой в js/app.js, и без этих адресов включение
# выглядело бы как «счётчик почему-то не работает».
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob: https://mc.yandex.ru; script-src 'self' 'unsafe-inline' https://mc.yandex.ru https://yastatic.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://mc.yandex.ru; worker-src 'self' blob:; frame-src https://mc.yandex.ru" always;
