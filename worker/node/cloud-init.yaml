#cloud-config
# ============ Первичная настройка машины в Yandex Cloud ============
#
# СТРОКА ВЫШЕ ОБЯЗАНА БЫТЬ ПЕРВОЙ В ФАЙЛЕ. Не второй, не после
# комментариев — именно первой. cloud-init смотрит только на неё: если там
# что-то другое, он молча пропускает весь файл. Машина при этом поднимается
# чистой Ubuntu, ошибки нигде не появляется, и понять это можно лишь по
# времени в журнале — настройка «заканчивается» за пятнадцать секунд вместо
# десяти минут. Один раз мы на этом уже потеряли вечер.
#
# Здесь нарочно почти ничего нет. Вся установка живёт отдельными файлами
# в репозитории — worker/node/server-setup/ — и оттуда копируется на диск
# байт в байт. Причина: в прошлой версии настройка nginx была вписана
# сюда, и по дороге из строки try_files пропала переменная $uri. nginx
# отказался запускаться, сайт отдавал заглушку, а по файлу было не понять
# ничего — в нём всё было правильно.
#
# Отсюда же два следствия, ради которых всё и затевалось:
#   • любое исправление доезжает до сервера обычным git push — машина
#     раз в пять минут сама приводит себя в порядок по репозиторию;
#   • чинить сломанное можно, не пересоздавая машину.
#
# Секреты передаются в base64. Не ради скрытности — файл всё равно лежит
# только на самой машине с правами 600, — а чтобы их не испортила никакая
# подстановка по дороге. В base64 нет ни долларов, ни кавычек, ни обратных
# косых, ни кириллицы.

packages:
  - git
  - curl
  - ca-certificates

write_files:
  - path: /opt/pravofin/env.b64
    permissions: "0600"
    owner: root:root
    content: |
      __WORKER_ENV_B64__

runcmd:
  - mkdir -p /opt/pravofin
  - base64 -d /opt/pravofin/env.b64 > /opt/pravofin/env
  - chmod 600 /opt/pravofin/env
  - rm -f /opt/pravofin/env.b64
  - git clone --depth 1 https://github.com/divine-guest/ecofin.git /opt/pravofin/repo
  - bash /opt/pravofin/repo/worker/node/server-setup/setup.sh

final_message: "ПравоФин поднят. Проверьте: curl http://АДРЕС/api/health"
