#cloud-config
# ============ Первичная настройка машины в Yandex Cloud ============
#
# СТРОКА ВЫШЕ ОБЯЗАНА БЫТЬ ПЕРВОЙ В ФАЙЛЕ. Не второй, не после
# комментариев — именно первой. cloud-init смотрит только на неё: если там
# что-то другое, он молча пропускает весь файл. Машина при этом поднимается
# чистой Ubuntu, ошибки нигде не появляется, и понять это можно лишь по
# времени в журнале — настройка «заканчивается» за пятнадцать секунд вместо
# десяти минут. Один раз мы на этом уже потеряли вечер.
#
# Здесь нарочно почти ничего нет. Вся установка живёт отдельными файлами
# в репозитории — worker/node/server-setup/ — и оттуда копируется на диск
# байт в байт. Причина: в одной из прошлых версий настройка nginx была
# вписана сюда, и по дороге из строки try_files пропала переменная $uri.
# nginx отказался запускаться, сайт отдавал заглушку, а по файлу было не
# понять ничего — в нём всё было правильно.
#
# Поэтому здесь два правила:
#   • ничего длиннее одной команды;
#   • ни одного знака доллара, ни одной кавычки, которую можно потерять.
#
# Всё содержательное едет в base64: и ключи, и запускающий скрипт. Не ради
# скрытности — файлы всё равно лежат только на самой машине с правами 600, —
# а чтобы их не испортила никакая подстановка по дороге.
#
# Расписание прописывается прямо здесь, а не установщиком. Так машина
# получает право на вторую попытку ещё до того, как что-либо может пойти
# не так: даже если код не скачается совсем, через пять минут она
# попробует снова, и так пока не получится.

packages:
  - git
  - curl
  - ca-certificates

write_files:
  # -------- Ключи --------
  - path: /opt/pravofin/env.b64
    permissions: "0600"
    owner: root:root
    content: |
      __WORKER_ENV_B64__

  # -------- Скрипт, который добывает код --------
  - path: /opt/pravofin/bootstrap.b64
    permissions: "0600"
    owner: root:root
    content: |
      __BOOTSTRAP_B64__

  # -------- Расписание --------
  # Раз в пять минут машина приводит себя в порядок. flock не даёт двум
  # запускам наложиться: установка иногда идёт дольше пяти минут.
  - path: /etc/cron.d/pravofin
    permissions: "0644"
    owner: root:root
    content: |
      SHELL=/bin/bash
      PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      */5 * * * * root flock -n /var/lock/pravofin.lock /opt/pravofin/bootstrap.sh >> /var/log/pravofin-setup.log 2>&1

runcmd:
  - mkdir -p /opt/pravofin
  - base64 -d /opt/pravofin/env.b64 > /opt/pravofin/env
  - chmod 600 /opt/pravofin/env
  - base64 -d /opt/pravofin/bootstrap.b64 > /opt/pravofin/bootstrap.sh
  - chmod 755 /opt/pravofin/bootstrap.sh
  - rm -f /opt/pravofin/env.b64 /opt/pravofin/bootstrap.b64
  - bash /opt/pravofin/bootstrap.sh

final_message: "ПравоФин поднят. Проверьте: curl http://АДРЕС/api/health"
