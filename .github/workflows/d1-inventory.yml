# Что осталось в старой базе на Cloudflare.
#
# Перед тем как выключать старый сервер, надо знать: есть ли там живые
# пользователи и оплаты. Ответить на это можно числами, не заглядывая
# в сами данные, — и именно так скрипт и работает: никаких имён, почт
# и переписки в журнал не попадает. Журнал сборки виден всем, у кого
# есть доступ к репозиторию.
#
# Нужен секрет репозитория D1_API_TOKEN — токен Cloudflare с правом
# читать базу. Создаётся в панели Cloudflare, в чат его пересылать
# не нужно и не следует.
#
# Вкладка Actions → «Что в старой базе» → Run workflow.

name: Что в старой базе

on:
  workflow_dispatch:

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Считаю записи
        env:
          D1_API_TOKEN: ${{ secrets.D1_API_TOKEN }}
        run: node worker/d1-inventory.mjs
