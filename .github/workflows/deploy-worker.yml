name: Деплой API на Cloudflare (не используется)

# ВНИМАНИЕ: боевой сервис на Cloudflare больше не живёт.
#
# Он переехал на свою машину в Yandex Cloud и обновляется сам: сервер
# раз в пять минут подтягивает репозиторий и перезапускается. Ни выкатка
# отсюда, ни адрес pravofin-api.pravofin.workers.dev к нынешнему сервису
# отношения не имеют, а токены Cloudflare в секретах недействительны.
#
# Поэтому автоматический запуск убран. Раньше он срабатывал на каждый
# пуш с правкой worker/src и каждый раз падал — письмо о провале
# приходило владельцу по десять раз на дню. Хуже писем то, что красный
# значок на каждом коммите перестаёт что-либо значить: когда всё всегда
# красное, настоящую поломку никто не заметит.
#
# Файл оставлен на случай возвращения на Cloudflare: запускается только
# руками и только осознанно. Если возвращаться не планируется — удалить
# вместе с worker/deploy.mjs и wrangler.toml.
on:
  workflow_dispatch:
    inputs:
      reason:
        description: Зачем выкатываем
        required: false
        default: ручной запуск

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Собрать worker/.env из секрета
        working-directory: worker
        env:
          WORKER_ENV: ${{ secrets.WORKER_ENV }}
        run: |
          printf '%s' "$WORKER_ENV" > .env
          # В лог выводим только имена переменных, никогда значения
          echo "переменные:"; grep -o '^[A-Z_]*' .env | sed 's/^/  /'

      - name: Выкатить воркер
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_API_TOKEN: ${{ secrets.D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node deploy.mjs

      - name: Проверить, что API отвечает
        run: |
          sleep 5
          echo "ответ /api/health:"
          curl -sS --fail --max-time 30 https://pravofin-api.pravofin.workers.dev/api/health | tee /tmp/h.json
          echo
          grep -q '"db":true'    /tmp/h.json || { echo "::error::база не подключена"; exit 1; }
          grep -q '"aiKey":true' /tmp/h.json || { echo "::error::ключ ИИ не задан"; exit 1; }

      - name: Удалить .env
        if: always()
        working-directory: worker
        run: rm -f .env
