<body>
<main class="section tint-navy">
  <div class="container">
    <div class="section-title">
      <h1>База <span>знаний</span></h1>
      <div class="line"></div>
      <p class="subtitle">Статьи по УК РФ, НК РФ, ГК РФ, ТК РФ и ФЗ-115 + тесты для самопроверки</p>
    </div>

    <div class="tabs">
      <button class="tab active" onclick="switchKb(0,this)">📚 Статьи</button>
      <button class="tab" onclick="switchKb(1,this)">📝 Тесты</button>
    </div>

    <!-- Статьи -->
    <div class="tab-panel active" id="kb0">
      <input type="search" id="kbSearch" aria-label="Поиск по базе знаний" placeholder="Найти: патент, увольнение, блокировка счёта…"
             oninput="renderArticles(this.value)" style="margin-bottom:12px">
      <!-- Фильтр по областям: полсотни статей одним списком читаются плохо. -->
      <div class="qa-topics" id="kbAreas" style="margin-bottom:18px"></div>
      <div id="articleList"></div>
      <div class="article-full card" id="articleFull" style="margin-top:16px"></div>
    </div>

    <!-- Тесты -->
    <div class="tab-panel" id="kb1">
      <div class="grid cols-4" id="testList"></div>
      <div class="game-stage" id="testStage" style="display:none;margin-top:20px"></div>
    </div>
  </div>
</main>

<script src="js/api.js?v=155"></script>
<script src="js/app.js?v=155"></script>
<script src="js/progress.js?v=155"></script>
<script src="js/palette.js?v=155"></script>

<script>
initPage("knowledge.html");

function switchKb(i, btn) {
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  btn.classList.add("active");
  document.querySelectorAll(".tab-panel").forEach((p, j) => p.classList.toggle("active", i === j));
}

/* --- Статьи --- */
let kbArea = "";

/* Фильтр по областям: полсотни статей одним списком читаются плохо. */
function renderAreas() {
  const box = document.getElementById("kbAreas");
  if (!box || box.dataset.filled) return;
  box.dataset.filled = "1";
  const areas = [...new Set(ARTICLES.map(a => a.area).filter(Boolean))];
  box.innerHTML = areas.map(a =>
    `<button class="qa-chip" data-area="${escapeHtml(a)}" onclick="pickArea('${escapeHtml(a)}')">${escapeHtml(a)}</button>`
  ).join("");
}

function pickArea(a) {
  kbArea = kbArea === a ? "" : a;
  document.querySelectorAll("#kbAreas .qa-chip").forEach(c =>
    c.classList.toggle("on", c.dataset.area === kbArea));
  renderArticles(document.getElementById("kbSearch")?.value || "");
}

function renderArticles(filter = "") {
  renderAreas();
  const f = filter.toLowerCase();
  const list = ARTICLES.map((a, i) => ({ ...a, i }))
    .filter(a => !kbArea || a.area === kbArea)
    /* Ищем и по шагам с ошибками: человек часто помнит формулировку ошибки,
       а не заголовок статьи. */
    .filter(a => !f || (a.title + a.code + (a.summary || "") + a.body +
      (a.steps || []).join(" ") + (a.mistakes || [])
        .join(" ")).toLowerCase().includes(f));

  /* Настоящие ссылки, а не div с обработчиком. Человеку это даёт
     «открыть в новой вкладке» и адрес, который можно переслать;
     поисковику — путь к 28 отдельным страницам статей, без которых
     вся база знаний для него не существует. Клик по-прежнему
     открывает статью тут же, без перезагрузки. */
  document.getElementById("articleList").innerHTML = list.length
    ? list.map(a => `<a class="article-item" href="st/${kbSlug(a.title)}.html"
        onclick="return openArticle(${a.i}, event)">
        <b>${escapeHtml(a.title)}</b> <span class="badge">${escapeHtml(a.code)}</span>
        <div class="meta">${escapeHtml(a.summary || a.body.slice(0, 120) + "…")}</div>
      </a>`).join("")
    : `<p style="color:var(--muted)">Ничего не найдено. Попробуйте другое слово или снимите фильтр по теме.</p>`;
}

/* Блоки статьи, которых раньше не было: что сделать, на чём попадаются,
   на какие нормы опереться, куда идти дальше. */
function renderArticleParts(a) {
  const list = (arr, cls) => arr.map(x => `<li>${escapeHtml(x)}</li>`).join("");
  let html = "";

  if (a.steps && a.steps.length) {
    html += `<div class="kb-part kb-steps">
      <h4>Что сделать</h4><ol>${list(a.steps)}</ol></div>`;
  }
  if (a.mistakes && a.mistakes.length) {
    html += `<div class="kb-part kb-mistakes">
      <h4>Частые ошибки</h4><ul>${list(a.mistakes)}</ul></div>`;
  }
  if (a.law && a.law.length) {
    html += `<div class="kb-part kb-law">
      <h4>Нормы</h4><p>${a.law.map(escapeHtml).join(" · ")}</p></div>`;
  }
  if (a.related && a.related.length) {
    const links = a.related.map(t => {
      const j = ARTICLES.findIndex(x => x.title === t);
      return j < 0 ? "" : `<button class="btn small secondary" onclick="openArticle(${j})">${escapeHtml(t)}</button>`;
    }).filter(Boolean).join("");
    if (links) html += `<div class="kb-part kb-related"><h4>Читать дальше</h4>
      <div style="display:flex;gap:8px;flex-wrap:wrap">${links}</div></div>`;
  }
  return html;
}
/* Адрес отдельной страницы статьи. Правило то же, что в build-seo.mjs;
   tests/content.mjs следит, чтобы обе стороны не разъехались — иначе
   ссылки из списка вели бы на несуществующие файлы. */
const KB_SLUG_MAP = {
  а:"a",б:"b",в:"v",г:"g",д:"d",е:"e",ё:"e",ж:"zh",з:"z",и:"i",й:"y",к:"k",л:"l",
  м:"m",н:"n",о:"o",п:"p",р:"r",с:"s",т:"t",у:"u",ф:"f",х:"h",ц:"c",ч:"ch",ш:"sh",
  щ:"sch",ъ:"",ы:"y",ь:"",э:"e",ю:"yu",я:"ya",
};
function kbSlug(title) {
  return title.toLowerCase()
    .replace(/[а-яё]/g, c => KB_SLUG_MAP[c] ?? c)
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-+|-+$/g, "")
    .slice(0, 70);
}

/* event приходит только при клике по ссылке: тогда гасим переход и
   открываем статью на месте. Из кода (по ссылке из кабинета) событие
   не передаётся, и функция работает как раньше. */
function openArticle(i, event) {
  if (event) {
    /* Ctrl, Shift и средняя кнопка — человек хочет новую вкладку.
       Отнимать у него это нельзя. */
    if (event.ctrlKey || event.metaKey || event.shiftKey || event.button === 1) return true;
    event.preventDefault();
  }
  const a = ARTICLES[i];
  const el = document.getElementById("articleFull");
  el.classList.add("show");
  markRead(a.title);
  /* Правовой текст без даты проверки не заслуживает доверия и рискован
     юридически: нормы меняются, а статья выглядит вечной. Дату берём
     из единого конфига ставок, чтобы она не разъезжалась с расчётами. */
  const checked = (typeof RATES !== "undefined")
    ? new Date(RATES.checkedOn).toLocaleDateString("ru-RU") : null;

  /* Ссылка на нужный калькулятор прямо из статьи: человек читает про УСН —
     логично тут же посчитать свою нагрузку, а не искать раздел. */
  const CALC_FOR = [
    [/самозанят|НПД/i, "calc.html#tax", "Сравнить с УСН на калькуляторе"],
    [/УСН|патент|ПСН|режим/i, "calc.html#tax", "Посчитать свою налоговую нагрузку"],
    [/больничн/i, "calc.html", "Рассчитать больничный"],
    [/отпуск/i, "calc.html", "Рассчитать отпускные"],
    [/вычет/i, "calc.html", "Посчитать вычет"],
    [/дивиденд/i, "calc.html", "Посчитать налог с дивидендов"],
    [/неустойк|пени|пеня/i, "calc.html", "Посчитать пеню"],
    [/договор|претенз|акт/i, "tools.html", "Разобрать свой договор"],
  ];
  const hit = CALC_FOR.find(([re]) => re.test(a.title + " " + a.body));

  el.innerHTML = `<span class="badge">${escapeHtml(a.code)}</span>
    <h3 style="margin:10px 0">${escapeHtml(a.title)}</h3>
    ${a.summary ? `<p class="kb-summary">${escapeHtml(a.summary)}</p>` : ""}
    <div class="body">${escapeHtml(a.body)}</div>
    ${renderArticleParts(a)}
    ${checked ? `<p class="hint" style="margin-top:14px">
      Сверено с первоисточником ${checked}. Нормы меняются — перед подачей
      документов проверьте актуальную редакцию (сайт ФНС, КонсультантПлюс).
      Материал информационный, не заменяет юридическую консультацию.</p>` : ""}
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px">
      ${hit ? `<a class="btn small" href="${hit[1]}">${hit[2]}</a>` : ""}
      <button class="btn small secondary" onclick="askAboutArticle(${i})">Спросить ИИ по теме</button>
      <button class="btn small secondary" onclick="document.getElementById('articleFull').classList.remove('show')">Закрыть</button>
    </div>`;
  el.scrollIntoView({ behavior: "smooth" });
  COMP.award(COMP.articleArea(a.code, a.area), 2);
  PF.logAction("Чтение статьи: " + a.title);
}
/* Вопрос по статье уходит в чат-консультанта с уже подставленной темой:
   это самый частый следующий шаг после чтения. */
function askAboutArticle(i) {
  const a = ARTICLES[i];
  if (!PF.user()) {
    sessionStorage.setItem("pf_pending_question", `По теме «${a.title}»: `);
    toast("Войдите, чтобы спросить консультанта");
    return setTimeout(() => (location.href = "auth.html"), 1200);
  }
  chatToggle();
  const input = document.getElementById("chatInput");
  input.value = `У меня вопрос по теме «${a.title}». `;
  input.focus();
}

renderArticles();

/* --- Тесты --- */
document.getElementById("testList").innerHTML = Object.entries(TESTS).map(([key, t]) =>
  `<div class="card" onclick="startTest('${key}')">
     <h3>${t.title}</h3>
     <p>${t.questions.length} вопросов · ~5 минут</p>
   </div>`).join("");

let test = null, testKey = null, qIdx = 0, correct = 0;

function startTest(key) {
  test = TESTS[key]; testKey = key; qIdx = 0; correct = 0;
  document.getElementById("testStage").style.display = "block";
  document.getElementById("testStage").scrollIntoView({ behavior: "smooth" });
  renderQuestion();
}
/* Порядок вариантов перемешивается при каждом показе. Так угадать по
   расположению нельзя в принципе — раньше 16 из 19 правильных ответов
   стояли посередине, и тест проходился, не читая вопросов. */
let shuffled = [];

function shuffleOpts(c) {
  const pairs = c.opts.map((text, i) => ({ text, right: i === c.correct }));
  for (let i = pairs.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pairs[i], pairs[j]] = [pairs[j], pairs[i]];
  }
  return pairs;
}

function renderQuestion() {
  const c = test.questions[qIdx];
  shuffled = shuffleOpts(c);
  document.getElementById("testStage").innerHTML = `
    <p class="badge">${escapeHtml(test.title)} · вопрос ${qIdx + 1} из ${test.questions.length}</p>
    <div class="progress-bar" style="margin:12px 0"><div style="width:${(qIdx / test.questions.length) * 100}%"></div></div>
    <h3 style="margin-bottom:16px">${escapeHtml(c.text)}</h3>
    ${shuffled.map((o, i) => `<button class="quiz-option" onclick="answerTest(${i})">${escapeHtml(o.text)}</button>`).join("")}
    <div id="quizWhy"></div>`;
}

function answerTest(i) {
  const c = test.questions[qIdx];
  const btns = document.querySelectorAll("#testStage .quiz-option");
  btns.forEach((b, j) => {
    b.disabled = true;
    if (shuffled[j].right) b.classList.add("correct");
    else if (j === i) b.classList.add("wrong");
  });

  const right = shuffled[i].right;
  if (right) correct++;

  /* Разбор показываем всегда, а не только при ошибке: угадавший тоже
     не обязательно понимает, почему это верно. Дальше — по кнопке,
     чтобы человек успел прочитать. */
  const last = qIdx + 1 >= test.questions.length;
  document.getElementById("quizWhy").innerHTML = `
    <div class="quiz-why ${right ? "ok" : "no"}">
      <b>${right ? "Верно" : "Неверно"}</b>
      ${c.why ? `<p>${escapeHtml(c.why)}</p>` : ""}
      <button class="btn small" onclick="nextQuestion()">${last ? "Показать результат" : "Дальше"}</button>
    </div>`;
  document.getElementById("quizWhy").scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function nextQuestion() {
  qIdx++;
  if (qIdx >= test.questions.length) finishTest(); else renderQuestion();
}
function finishTest() {
  const pct = Math.round((correct / test.questions.length) * 100);
  PF.addScore("quiz", pct);
  const grown = COMP.award(COMP.testArea[testKey] || "contracts", Math.round(pct * 0.15));
  PF.logAction(`Тест «${test.title}»: ${pct}%`);
  document.getElementById("testStage").innerHTML = `
    <div style="text-align:center">
      <h3>${pct >= 80 ? "Отличный результат" : pct >= 50 ? "Неплохо" : "Есть куда расти"}</h3>
      <p class="stat-value">${pct}%</p>
      <p style="color:var(--muted)">Верно ${correct} из ${test.questions.length} · компетенция +${grown}%</p><br>
      <button class="btn" onclick="startTest('${testKey}')">Пройти ещё раз</button>
      <a class="btn secondary" href="#kbTop" onclick="document.querySelectorAll('.tab')[0].click()">К статьям</a>
    </div>`;
}

/* Что человек уже читал.

   «Личный план развития» в кабинете подбирает следующую статью и
   пропускает прочитанные — но отметки никто не ставил, и план всегда
   советовал одну и ту же статью, сколько бы её ни открывали.
   Список уезжает на сервер: читал на телефоне — учтётся на компьютере. */
function markRead(title) {
  const u = PF.user();
  if (!u) return;
  const key = "pf_read_" + u.email;
  let list = [];
  try { list = JSON.parse(localStorage.getItem(key) || "[]"); } catch {}
  if (list.includes(title)) return;
  list.push(title);
  localStorage.setItem(key, JSON.stringify(list.slice(-200)));
  if (typeof PROGRESS !== "undefined") PROGRESS.push("read");
}

/* Открытие по ссылке из кабинета: #a=Заголовок статьи или #test=ключ.
   Без этого «личный план» вёл просто на страницу, и человеку всё равно
   приходилось искать нужное глазами. */
function openFromHash() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (h.startsWith("a=")) {
    const title = h.slice(2);
    const i = ARTICLES.findIndex(a => a.title === title);
    if (i >= 0) { document.querySelectorAll(".tabs .tab")[0]?.click(); openArticle(i); }
  } else if (h.startsWith("test=")) {
    const key = h.slice(5);
    if (TESTS[key]) { document.querySelectorAll(".tabs .tab")[1]?.click(); startTest(key); }
  }
}
openFromHash();
window.addEventListener("hashchange", openFromHash);
</script>
