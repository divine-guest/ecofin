<body>
<main class="section tint-green">
  <div class="container">
    <div class="section-title">
      <h1>Обучающие <span>курсы</span></h1>
      <div class="line"></div>
      <p class="subtitle">Финансовая грамотность — бесплатно · Бухучёт и юриспруденция — по подписке Pro</p>
    </div>
    <div id="coursesView"></div>
    <div id="lessonView"></div>
  </div>
</main>

<script src="js/themes.js?v=105"></script>
<script src="js/api.js?v=105"></script>
<script src="js/app.js?v=105"></script>
<script src="js/progress.js?v=105"></script>
<script src="js/palette.js?v=105"></script>
<script src="js/ai.js?v=105"></script>
<script src="js/competencies.js?v=105"></script>
<script src="js/courses.js?v=105"></script>
<script>
initPage("courses.html");

function renderCourses() {
  document.getElementById("lessonView").innerHTML = "";
  const prog = COURSE_PROGRESS.get();
  document.getElementById("coursesView").innerHTML = `<div class="grid cols-3">` + COURSES.map(c => {
    const done = (prog[c.id] || []).length;
    const pct = Math.round((done / c.lessons.length) * 100);
    const locked = !c.free && !PF.hasFeature("courses");
    return `
      <div class="card" onclick="openCourse('${c.id}')" style="cursor:pointer">
        <h3>${c.title} ${c.free ? '<span class="badge ok">Бесплатно</span>' : '<span class="badge pro">Pro</span>'}</h3>
        <p>${c.desc}</p><br>
        <p style="font-size:var(--t-sm);color:var(--muted)">${c.lessons.length} уроков · ${c.lessons.reduce((s, l) => s + l.mins, 0)} минут</p>
        <div class="progress-bar" style="margin:10px 0 6px"><div style="width:${pct}%"></div></div>
        <p style="font-size:var(--t-xs);color:var(--muted)">${locked ? "Первый урок бесплатно, остальные — в «Про»" : `Пройдено ${pct}%`}</p>
      </div>`;
  }).join("") + `</div>`;
}

function openCourse(id) {
  const c = COURSES.find(x => x.id === id);
  const prog = new Set(COURSE_PROGRESS.get()[id] || []);
  document.getElementById("coursesView").innerHTML = "";
  const view = document.getElementById("lessonView");
  view.innerHTML = `
    <button class="btn small secondary" onclick="renderCourses()" style="margin-bottom:18px">← Все курсы</button>
    <div class="section-title" style="margin-bottom:24px">
      <h2>${c.title} ${c.free ? '<span class="badge ok">Бесплатно</span>' : '<span class="badge pro">Pro</span>'}</h2>
      <p class="subtitle">${c.desc}</p>
    </div>
    <div class="grid cols-2">
      <div class="card">
        <h3>Программа</h3>
        ${c.lessons.map((l, i) => `
          <div class="article-item" onclick="openLesson('${id}', ${i})" style="${prog.has(i) ? "border-color:var(--primary)" : ""}">
            <b>Урок ${i + 1}. ${l.title}</b> ${prog.has(i) ? '<span class="badge ok">✓</span>' : ""}
            <div class="meta">≈ ${l.mins} мин чтения</div>
          </div>`).join("")}
      </div>
      <div class="card" id="lessonBox">
        <h3>Выберите урок слева</h3>
        <p style="color:var(--muted)">Откройте первый урок и отмечайте изученное — прогресс сохраняется автоматически.</p>
      </div>
    </div>`;
}

async function openLesson(id, i) {
  const c = COURSES.find(x => x.id === id);
  const l = c.lessons[i];
  const prog = new Set(COURSE_PROGRESS.get()[id] || []);
  const box = document.getElementById("lessonBox");

  /* Текст платного урока лежит на сервере и приходит только тому,
     у кого есть доступ. В файле курсов его нет. */
  let body = l.body;
  if (!body && l.locked) {
    box.innerHTML = `<p class="hint">Открываем урок…</p>`;
    try {
      const r = await API.courseLesson(id, i);
      body = r.lesson.body;
      l.body = body;                       // в пределах сессии не перезапрашиваем
      l.preview = Boolean(r.preview);
    } catch (e) {
      if (e.isPaywall) { showPaywall(e.message); box.innerHTML = ""; return; }
      /* 404 значит, что сервер ещё не знает про выдачу уроков — это
         состояние выката, а не поломка у человека. Говорим по-человечески. */
      box.innerHTML = e.status === 404
        ? `<div class="empty"><b>Урок готовится</b>
             <p>Материал скоро откроется. Остальные разделы работают как обычно.</p>
             <a href="knowledge.html" class="btn small">Пока в базу знаний</a></div>`
        : `<p class="hint">Не удалось загрузить урок: ${escapeHtml(e.message)}. Попробуйте ещё раз.</p>`;
      return;
    }
  }

  box.innerHTML = `
    <h3>Урок ${i + 1}. ${l.title}</h3>
    <p style="color:var(--muted);font-size:var(--t-sm)">≈ ${l.mins} минут</p>
    <div class="ai-result show" style="border-image:none">${escapeHtml(body || "")}</div>
    ${l.preview ? `<div class="empty" style="margin-top:16px;text-align:left">
        <b>Это первый урок из ${c.lessons.length}</b>
        <p>Остальные разбирают первичку, кассу, отчётность и проверки —
        с формулировками, которые можно применять сразу.</p>
        <button class="btn small gold" onclick="PAY.open('pro')">Открыть весь курс</button>
      </div>` : ""}
    <br>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      ${i > 0 ? `<button class="btn small secondary" onclick="openLesson('${id}', ${i - 1})">← Предыдущий</button>` : ""}
      <button class="btn small ${prog.has(i) ? "secondary" : ""}" onclick="completeLesson('${id}', ${i})">
        ${prog.has(i) ? "Пройден ✓" : "Отметить пройденным"}
      </button>
      ${i < c.lessons.length - 1
        ? `<button class="btn small" onclick="openLesson('${id}', ${i + 1})">Следующий →</button>`
        : `<button class="btn gold" onclick="finishCourse('${id}')">Завершить курс</button>`}
    </div>`;
  PF.logAction("Урок курса: " + l.title);
}

function completeLesson(id, i) {
  COURSE_PROGRESS.done(id, i);
  COMP.award(COMP.courseArea[id] || "contracts", 8);
  PF.logAction("Пройден урок " + (i + 1) + " курса " + id);
  openCourse(id);
  openLesson(id, i);
  checkCertificate(id);
}

function finishCourse(id) {
  const c = COURSES.find(x => x.id === id);
  c.lessons.forEach((_, i) => COURSE_PROGRESS.done(id, i));
  COMP.award(COMP.courseArea[id] || "contracts", 8);
  openCourse(id);
  checkCertificate(id);
}

function checkCertificate(id) {
  const c = COURSES.find(x => x.id === id);
  const prog = new Set(COURSE_PROGRESS.get()[id] || []);
  if (prog.size < c.lessons.length) return;
  const u = PF.user();
  let bd = document.getElementById("certBackdrop");
  if (!bd) {
    bd = document.createElement("div");
    bd.id = "certBackdrop";
    bd.className = "modal-backdrop";
    document.body.appendChild(bd);
  }
  bd.classList.add("open");
  /* Номер сертификата детерминированный: у одного человека за один курс
     он всегда один и тот же. Иначе при повторном открытии выдавался бы
     новый номер, и документ переставал быть документом. */
  const seed = (u ? u.email : "guest") + "|" + c.id;
  let h = 0;
  for (const ch of seed) h = (h * 33 + ch.charCodeAt(0)) >>> 0;
  const number = "ПФ-" + String(h % 100000).padStart(5, "0");
  const date = new Date().toLocaleDateString("ru-RU");

  bd.innerHTML = `
    <div class="modal cert-modal">
      <div class="cert" id="certSheet">
        <span class="cert-kicker">Сертификат</span>
        <p class="cert-lead">ЭкоФин подтверждает, что</p>
        <h3 class="cert-name">${escapeHtml(u ? u.name : "Пользователь")}</h3>
        <p class="cert-lead">прошёл полный курс</p>
        <h4 class="cert-course">«${escapeHtml(c.title)}»</h4>
        <div class="cert-meta">
          <span><b>${c.lessons.length}</b> ${plural(c.lessons.length, "урок", "урока", "уроков")}</span>
          <span><b>${date}</b></span>
          <span><b>${number}</b></span>
        </div>
        <p class="cert-note">Документ подтверждает прохождение курса в сервисе ЭкоФин.
          Он не заменяет диплом или свидетельство государственного образца.</p>
      </div>
      <div class="cert-actions no-print">
        <button class="btn" onclick="printCert()">Скачать / распечатать</button>
        <button class="btn secondary" onclick="document.getElementById('certBackdrop').classList.remove('open')">Закрыть</button>
      </div>
    </div>`;
  PF.logAction("Сертификат за курс: " + c.title + " (" + number + ")");
  PF.addScore("quiz", 100);
  trackEvent("certificate", { course: c.id });
}

/* Печатаем только сам сертификат. Раньше здесь стоял window.print(),
   который выводил на бумагу всю страницу целиком — со списком курсов,
   шапкой и подвалом. Документом это не выглядело. */
function printCert() {
  document.body.classList.add("printing-cert");
  window.print();
  setTimeout(() => document.body.classList.remove("printing-cert"), 500);
}

renderCourses();
</script>
</body>
</html>
