<!-- Библиотеку документов и базу знаний подключаем сюда специально:
     из них берутся названия для указателя, и без них страница показала

<script src="js/templates.js?v=131"></script>
<script src="js/knowledge.js?v=131"></script>
<script src="js/palette.js?v=131"></script>
<script>
initPage("features.html");

/* ============ Витрина возможностей ============

   Зачем страница нужна.

   В навигации пятнадцать адресов, и человек, попавший сюда впервые, не
   знает, что за ними. «Практикум» и «Что делать» ничего не говорят тому,
   кто у нас в первый раз, а половина возможностей вообще не в меню —
   они внутри вкладок калькуляторов и инструментов.

   Убирать разделы ради простоты — неправильно: они рабочие и нужные.
   Правильно — дать место, где видно всё сразу.

   Список берётся из указателя быстрого поиска, а не пишется руками.
   Это принципиально: руками написанный перечень устареет на первом же
   новом калькуляторе, и витрина начнёт врать. Здесь она физически не
   может разойтись с содержанием — источник один.                     */

/* Порядок разделов — по тому, зачем приходят: сначала посчитать,
   потом оформить бумагу, потом разобраться. */
const GROUPS = [
  ["Раздел",      "Разделы сервиса",  "С чего начать"],
  ["Действие",    "Быстрые действия", "Вызываются из поиска по Ctrl+K"],
  ["Калькулятор", "Расчёты",          "Посчитать налог, выплату, срок"],
  ["Инструмент",  "ИИ-инструменты",   "Разобрать, составить, объяснить"],
  ["Документ",    "Готовые документы","Заполнить поля — документ соберётся сам"],
  ["Календарь",   "Календарь",        "Сроки отчётности"],
  ["Статья",      "База знаний",      "Разборы простым языком"],
];

function featureItems() {
  const all = PALETTE.base();
  const seen = new Set();
  return all.filter(it => {
    const key = it.kind + "|" + it.title;
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

/* Сколько записей указателя витрина НЕ показывает и почему.

   Часть быстрых действий вызывается обработчиком и адреса не имеет —
   ссылкой такое не покажешь. Молча их пропустить нельзя: витрина
   обещает «всё, что умеет сервис». Поэтому называем их числом и
   отправляем туда, откуда они вызываются. */
function hiddenNote(items) {
  const noHref = items.filter(it => !it.href).length;
  if (!noHref) return "";
  return `<p class="feat-note">Ещё ${noHref} быстрых команд вызываются
    из поиска по сочетанию Ctrl + K: задать вопрос консультанту,
    открыть настройки, сменить оформление.</p>`;
}

function renderFeatures() {
  const q = (document.getElementById("featFind").value || "").trim().toLowerCase();
  const items = featureItems();
  const root = document.getElementById("featRoot");

  const match = it => !q
    || it.title.toLowerCase().includes(q)
    || String(it.note || "").toLowerCase().includes(q);

  let html = "";
  let shown = 0;

  for (const [kind, title, hint] of GROUPS) {
    const list = items.filter(it => it.kind === kind && it.href && match(it));
    if (!list.length) continue;
    shown += list.length;

    html += `
      <div class="feat-group">
        <div class="feat-head">
          <h2>${escapeHtml(title)}</h2>
          <span class="feat-count">${list.length}</span>
          <span class="feat-hint">${escapeHtml(hint)}</span>
        </div>
        <div class="feat-grid">
          ${list.map(it => `
            <a class="feat-card" href="${PF.href(it.href)}">
              <b>${escapeHtml(it.title)}</b>
              ${it.note ? `<span>${escapeHtml(it.note)}</span>` : ""}
            </a>`).join("")}
        </div>
      </div>`;
  }

  if (!shown) {
    html = `<p style="text-align:center;color:var(--muted)">
      Ничего не нашлось по запросу «${escapeHtml(q)}».
      Попробуйте одно слово: «пеня», «аренда», «увольнение».</p>`;
  }

  if (shown && !q) html += hiddenNote(items);
  root.innerHTML = html;
}

/* Ждём загрузки указателя: он собирается из библиотек документов и
   статей, которые подключены выше. */
renderFeatures();
document.addEventListener("pf:ready", renderFeatures);
</script>
